<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
  body{position:fixed;inset:0}   /* the page itself can never scroll (owner 20:02: the page scrolled under the thumb) */
  #stage,#gl,#cv{touch-action:none;-webkit-touch-callout:none}

  #gl,#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

  .card.hidden{display:none}
  #start{background:linear-gradient(180deg,rgba(0,0,0,.82) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.85) 100%)}
  .logo{width:52cqw;mix-blend-mode:screen;margin-bottom:1cqh}
  .live{display:inline-flex;align-items:center;gap:1.4cqw;background:#e8132b;font:400 4.6cqw "Bebas Neue",sans-serif;letter-spacing:.06em;padding:.5cqh 2.6cqw;border-radius:6px;margin-bottom:2.2cqh}

  @keyframes blink{50%{opacity:0}}
  .line{white-space:pre-line;font:700 4.6cqw/1.35 "Open Sans",sans-serif;margin:0 8cqw 4cqh;text-shadow:0 2px 6px #000}

  .btn{font:400 7.4cqw "Bebas Neue",sans-serif;letter-spacing:.05em;border:0;border-radius:10px;padding:1.4cqh 10cqw;cursor:pointer;background:#3BEA1E;color:#041;box-shadow:0 .7cqh 0 #1d7a0c,0 0 4cqw rgba(59,234,30,.5);animation:pulse 1.4s ease-in-out infinite}
  .btn.ghost{background:transparent;color:#fff;border:3px solid #fff;box-shadow:none;animation:none;font-size:5.6cqw;padding:1cqh 7cqw}
  @keyframes pulse{50%{transform:scale(1.05)}}
  #end{background:#050505;overflow:hidden;display:block;--green:#3BEA1E;--pink:#FF2FB3;--red:#ff3b4f;animation:endIn .45s ease-out}
  @keyframes endIn{from{opacity:0;transform:scale(1.04)}}
  #end.hidden{display:none}
  #end:not(.lostc) .l3grade,#end:not(.lostc) .l3scan,#end:not(.lostc) .elost{display:none}
  #end.lostc .ewon,#end.lostc .conf{display:none}
  #end.lostc .scene{filter:saturate(.45) brightness(.62) contrast(1.1)}

  #end.lostc .w3sticker .v{color:var(--red);text-shadow:.6cqw 0 0 rgba(0,255,255,.35),-.6cqw 0 0 rgba(255,0,80,.6),0 0 3cqw rgba(255,40,60,.5);animation:glitch 1.6s steps(1) infinite}
  #end .w3row{display:flex}
  #end .l3again{background:#fff;color:#111;box-shadow:0 1cqh 0 #9a9a9a}
  #end .w2chat div{color:#fff}
  #end.lostc .w3row.ewon,#end:not(.lostc) .w3row.elost{display:none}
     art, the green CRT wolf from the countdown asset, the horizontal title lockup, GET TICKETS as the deck's CTA. A column layout: nothing overlaps. */
  
  .chip{display:flex;gap:1.6cqw}
  .chip b,.chip span{font:400 4.4cqw "Bebas Neue";letter-spacing:.12em;padding:.3cqh 2.2cqw;border-radius:4px}
  .chip b{background:#e8132b}.chip span{background:rgba(0,0,0,.55)}
  @keyframes drift{to{transform:translate(-5%,2%) scale(1.07)}}
  .conf i{position:absolute;top:0;width:2.2cqw;height:1.2cqw;animation:fall 3.2s linear infinite}
  @keyframes fall{from{transform:translateY(-10cqh) rotate(0)}to{transform:translateY(110cqh) rotate(540deg)}}
  @keyframes flick{0%,92%{opacity:1}93%{opacity:.55;transform:translateX(1.5cqw)}95%{opacity:1;transform:none}}
  .lost{font:400 4.4cqw "Bebas Neue";letter-spacing:.14em;background:#222;color:#bbb;padding:.3cqh 2.2cqw;border-radius:4px}
  @keyframes glitch{0%,86%{transform:none}87%{transform:translate(-1.5cqw,.4cqh) skewX(-6deg)}90%{transform:translate(1.2cqw,-.4cqh)}93%{transform:none}}
  .w2 .scene{position:absolute;inset:0;background:url(assets/end/win_scene.webp) center 40%/cover;animation:push 12s ease-out forwards}
  @keyframes push{from{transform:scale(1.02)}to{transform:scale(1.12) translateY(-2%)}}
  .w2fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,0) 14%,rgba(0,0,0,0) 64%,rgba(0,0,0,.7) 84%,rgba(0,0,0,.9) 100%)}
  .w2smoke{position:absolute;left:-30%;right:-30%;height:44%;bottom:-14%;background:url(assets/end/pink_smoke.webp) center/cover;opacity:.9;filter:saturate(1.2);animation:rise 7s ease-in-out infinite alternate}
  .w2smoke.s2{left:-10%;right:-50%;bottom:-20%;filter:hue-rotate(160deg) saturate(1.4) brightness(.9);opacity:.55;animation-duration:9s;mix-blend-mode:screen}
  @keyframes rise{from{transform:translateY(4%) scale(1)}to{transform:translateY(-6%) scale(1.08)}}

  @keyframes slam{from{transform:rotate(-7deg) translateX(-110%)}to{transform:rotate(-7deg)}}
  .band .k{font:400 7cqw/1 "Bebas Neue";letter-spacing:.12em;color:#fff}
  .band .v{font:400 21cqw/.82 "Bebas Neue";color:var(--green);text-shadow:0 0 4cqw rgba(59,234,30,.55),.8cqw .8cqw 0 var(--pink);margin-top:-.4cqh}

  .w2chat div b{margin-right:1.2cqw}
  @keyframes pop{from{transform:translateY(2cqh) scale(.9);opacity:0}}
  .w2bottom{position:absolute;left:7cqw;right:7cqw;bottom:4cqh;display:flex;flex-direction:column;align-items:center}
  .w2date{background:#000;color:var(--green);border:.45cqw solid var(--green);font:400 5cqw "Bebas Neue";letter-spacing:.06em;padding:.2cqh 2.4cqw;margin-bottom:2cqh;transform:rotate(-2deg)}
  .w2cta{width:100%;height:9cqh;border:0;border-radius:2.4cqw;background:var(--green);color:#06130a;font:400 8.6cqw "Bebas Neue";letter-spacing:.1em;box-shadow:0 0 6cqw rgba(59,234,30,.5),0 1cqh 0 #1f8a0c;animation:beat 1.4s ease-in-out infinite 1.2s}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
  .w2again{margin-top:1.8cqh;font:400 5cqw "Bebas Neue";letter-spacing:.14em;color:#fff;opacity:.85}
  .w3 .scene{animation:push3 14s ease-out forwards}
  @keyframes push3{from{transform:scale(1)}to{transform:scale(1.06)}}
  .w3fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,0) 8%,rgba(0,0,0,0) 84%,rgba(0,0,0,.8) 94%,rgba(0,0,0,.9) 100%)}
  .w3sticker{position:absolute;left:4cqw;top:12.5cqh;transform:rotate(-6deg) scale(.82);transform-origin:left top;background:rgba(5,5,5,.9);border:.6cqw solid var(--green);box-shadow:1.2cqw 1.2cqw 0 var(--pink),0 2cqh 4cqh rgba(0,0,0,.5);padding:1cqh 3.4cqw 1.2cqh;animation:stick .5s cubic-bezier(.2,1.5,.4,1) both .3s}
  @keyframes stick{from{transform:rotate(-20deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(.82);opacity:1}}
  .w3sticker .k{font:400 5cqw/1 "Bebas Neue";letter-spacing:.12em}
  .w3sticker .v{font:400 15cqw/.85 "Bebas Neue";color:var(--green);text-shadow:0 0 3cqw rgba(59,234,30,.5)}
  .w3sticker .cnt{display:flex;align-items:center;gap:1.6cqw;margin-top:.4cqh}
  .w3sticker .cnt span{font:400 9cqw/1 "Bebas Neue";font-variant-numeric:tabular-nums}
  .w3sticker .cnt i{font:700 2.6cqw/1.2 "Open Sans";font-style:normal;color:#ddd}
  .w3 .w2chat{top:24cqh;right:3cqw;width:36cqw;height:22cqh}
  .w3row{position:absolute;left:5cqw;right:5cqw;bottom:2.6cqh;display:flex;gap:2.4cqw;align-items:center}
  .w3row .w2cta{flex:1;height:7.6cqh;font-size:7.6cqw}
  .w3again{flex:none;width:7.6cqh;height:7.6cqh;border-radius:50%;border:.5cqw solid rgba(255,255,255,.75);background:rgba(0,0,0,.6);color:#fff;font:700 6cqw/1 "Open Sans"}
  .w3 .w2bottom{bottom:3.5cqh}
  .l3 .scene{filter:saturate(.45) brightness(.62) contrast(1.1)}
  .l3grade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(120,0,20,.28),rgba(40,0,10,.35));mix-blend-mode:multiply;animation:cut 2.6s steps(1) infinite}
  @keyframes cut{0%,90%{opacity:1}91%{opacity:.3;transform:translateX(2cqw)}93%{opacity:1;transform:none}}
  .l3scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 2px,transparent 2px 4px)}
  .l3sticker{border-color:var(--red);box-shadow:1.2cqw 1.2cqw 0 #6a0d18,0 2cqh 4cqh rgba(0,0,0,.5)}
  .l3sticker .v{color:var(--red);text-shadow:.6cqw 0 0 rgba(0,255,255,.35),-.6cqw 0 0 rgba(255,0,80,.6),0 0 3cqw rgba(255,40,60,.5);animation:glitch 1.6s steps(1) infinite}
  .l3tip{position:absolute;left:5cqw;right:5cqw;bottom:12.6cqh;display:flex;gap:2.4cqw;align-items:center;background:rgba(20,4,8,.88);border:.35cqw solid rgba(255,59,79,.6);border-radius:2cqw;padding:1.2cqh 3cqw}

  .l3tip p{margin:0;font:700 3.3cqw/1.35 "Open Sans";color:#fff}
  .l3 .w3row .l3again{background:#fff;color:#111;box-shadow:0 1cqh 0 #9a9a9a}
  .l3tix{flex:none;height:7.6cqh;padding:0 3.4cqw;border-radius:2.4cqw;border:.5cqw solid var(--green);background:rgba(0,0,0,.6);color:var(--green);font:400 5.4cqw "Bebas Neue";letter-spacing:.1em}
  #end h1{font:400 15cqw/1 "Bebas Neue",sans-serif;margin:0 0 1cqh;color:#ff3b4f;text-shadow:0 0 4cqw rgba(255,59,79,.6)}
  #end.won h1{color:#3BEA1E;text-shadow:0 0 4cqw rgba(59,234,30,.6)}
  .score{font:700 4cqw "Open Sans";margin-bottom:3cqh;opacity:.95} .score b{font:400 9cqw "Bebas Neue";color:#fff;display:block}
  .row{display:flex;gap:3cqw;align-items:center;margin-top:1.6cqh}
  .tag{position:absolute;left:2cqw;bottom:1cqh;font:600 2.4cqw "Open Sans";color:#888}
  #load{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at 50% 40%,#1c2230,#07080b 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;transition:opacity .6s}
  #load.done{opacity:0;pointer-events:none}
  #load img{width:min(62vw,42vh);filter:drop-shadow(0 6px 24px rgba(0,0,0,.6))}
  #load .bar{width:min(52vw,34vh);height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
  #load .bar i{display:block;height:100%;width:4%;background:#3BEA1E;border-radius:3px;transition:width .25s}
  #load .t{font:700 min(3.4vw,2.2vh) "Open Sans",sans-serif;letter-spacing:.18em;color:#9aa3b2;text-transform:uppercase;min-height:1.4em}
  #load .t.live{color:#3BEA1E;font-family:"Bebas Neue",Impact,sans-serif;font-size:min(7vw,4.4vh);letter-spacing:.12em}
  #load .rec{display:flex;align-items:center;gap:1.4vh;font:400 min(5vw,3.2vh) "Bebas Neue",Impact,sans-serif;letter-spacing:.12em;color:#fff}

  @keyframes blink{to{visibility:hidden}}
</style></head><body>
<div id="load"><img src="assets/logo-title.png" alt=""><div class="rec"><b><i></i>REC</b><span id="loadV">0 watching</span></div><div class="bar"><i id="loadBar"></i></div><div class="t" id="loadT">Masks on…</div></div>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="cv"></canvas>
  <div id="start" class="card">
    <img class="logo" src="assets/logo-title.png" alt="">
    <div class="live"><i></i>LIVE</div>
    <div class="line">Drag to move. Hide behind pillars:<br><b>red light</b> sees you. Tap to hack.</div>
    <button id="play" class="btn">Go live</button>
  </div>
  <div id="end" class="card hidden w2 w3">
    <div class="scene" style="background-image:url(assets/end/poster_intl.webp);background-position:center top"></div><div class="l3grade"></div><div class="l3scan"></div><div class="w3fade"></div>
    <div class="conf" id="conf"></div>
    <div class="w2top"><div class="chip ewon"><b>● LIVE · ENDED</b></div><div class="lost elost">■ SIGNAL LOST</div></div>
    <div class="w3sticker" id="endSticker"><div class="k" id="endK">YOU WENT</div><div class="v" id="endT">VIRAL</div><div class="cnt"><span id="endV">0</span><i id="endW">WATCHED YOU<br>ROB IT LIVE</i></div></div>
    <div class="w2chat" id="endChat"></div>
    <div class="l3tip elost" id="endTip"><span class="why">WHY</span><p id="endWhy"></p></div>
    <div class="w3row ewon"><button class="w3again again" title="Play again">↻</button><button class="w2cta tickets">GET TICKETS</button></div>
    <div class="w3row elost"><button class="l3tix tickets">TICKETS</button><button class="w2cta l3again again">↻ TRY AGAIN</button></div>
  </div>
  
</div>
