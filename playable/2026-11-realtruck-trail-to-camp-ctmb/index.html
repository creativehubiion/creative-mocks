<!doctype html>
<html lang="en">
<head>
<script id="iion-r2-redirect">/* this mock lives on creative-mocks.iion.media now (tools/port-to-r2.py); the copy here stays as a fallback */if(/github\.io$/.test(location.hostname)&&window.top===window){var p=location.pathname.replace(/^\/creative-mocks/,'');if(/\/$/.test(p))p+='index.html';location.replace('https://creative-mocks.iion.media'+p+location.search+location.hash);}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>/* RealTruck is a social playable and the game is responsive (an exception to the 2:3 phone page, user 2026-11-12): a computer sees it
   on our MacBook, a phone opens the game itself full screen. ?laptop keeps the laptop on a phone; ?v= goes with it. */
{const q=new URLSearchParams(location.search),ua=navigator.userAgent||'';
 const phone=(navigator.userAgentData&&navigator.userAgentData.mobile)||/iPhone|iPod|Android.+Mobile|Windows Phone|Mobile Safari/i.test(ua)&&!/iPad|Tablet/i.test(ua);
 if(phone&&!q.has('laptop')&&!q.has('desktop')){const v=q.get('v');location.replace('mock.html'+(v?'?v='+encodeURIComponent(v):''));}}</script>
<meta name="robots" content="noindex,nofollow">
<title>iion · RealTruck: Trail to Camp</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../shared/favicon-32.png"><link rel="icon" type="image/png" sizes="64x64" href="../../shared/favicon-64.png"><link rel="apple-touch-icon" href="../../shared/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../shared/page.css?v=11">
<link rel="stylesheet" href="../../shared/laptop.css?v=5">
<style>.laptop .screen iframe{pointer-events:auto}   /* a game to play, not a video to watch */</style>
</head>
<body>
<nav class="nav"><img src="../../shared/iion-logo.png?v=2" alt="iion"></nav>

<section class="hero">
  <div class="eyebrow">Playable · RealTruck Australia Black Friday</div>
  <h1>Trail to Camp</h1>
  <p>A 3D off-road playable for RealTruck Australia’s Black Friday: build the ute, then drive the trail to camp.</p>
</section>

<section class="stage">
  <div class="laptop">
    <div class="lid"><div class="bezel">
      <div class="screen">
        <!-- the RealTruck game as delivered (white-label Vercel build, unchanged); responsive, so it fills the 16:10 screen -->
        <iframe src="mock.html" title="RealTruck Trail to Camp playable" allow="autoplay; fullscreen"></iframe><script>{const v=new URLSearchParams(location.search).get("v"),f=document.currentScript.previousElementSibling;if(v&&f&&f.tagName==="IFRAME")f.src=f.getAttribute("src")+"?v="+encodeURIComponent(v);}</script>
        <div class="glass"></div>
      </div>
      <i class="cam"></i>
    </div></div>
    <div class="base"></div>
    <div class="floor"></div>
  </div>
</section>

<script src="../../shared/theme.js?v=6"></script>
</body>
</html>
