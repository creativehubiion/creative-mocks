.end[hidden]{display:none}
@keyframes endin{from{opacity:0;transform:scale(1.04)}}
.brand{height:42px;display:grid;place-items:center}
.endLogo{height:42px;width:42px;display:block}
.logoPh{width:46px;height:40px;border:1.5px dashed #b0a998;border-radius:8px;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.endLogo[hidden],.logoPh[hidden]{display:none}
.endTitle{width:172px;height:auto;display:block}
.heroBtn{border:0;background:none;padding:0;cursor:pointer;width:100%;margin-top:8px}
#heroImg{width:100%;height:auto;display:block;animation:heroin .45s cubic-bezier(.2,1.25,.4,1) both}
@keyframes heroin{from{opacity:0;transform:translateY(-10px) scale(.92)}}
.headline{font-size:17px;font-weight:800;text-align:center;line-height:1.15}
.line{font-size:13px;font-weight:700;text-align:center;color:var(--red)}
.headline[hidden],.line[hidden]{display:none}
.result{text-align:center;display:grid;gap:2px;margin-top:14px}
.big{font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:#db0007;letter-spacing:-.5px}
.cap{font-size:12px;font-weight:700;color:var(--muted)}
.actions{margin-top:auto;display:grid;gap:1px;width:100%;justify-items:center;padding:0 3px}
.again{border:0;background:none;min-height:32px;padding:0 16px;font-size:12px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* drawn in CSS, not from an image, so the edges stay sharp however far the stage is scaled */
.btn{
  width:100%;min-height:46px;padding:0 16px 3px;cursor:pointer;color:#27251f;font-weight:800;font-size:15px;letter-spacing:.1px;
  border:2px solid #27251f;border-radius:24px;background:linear-gradient(180deg,#ffd75e 0%,#ffbc0d 58%,#f7ab00 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 #dd9400,0 2px 0 rgba(39,37,31,.18);
}
.btn:active{padding-bottom:1px;transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 #dd9400}
@media (prefers-reduced-motion: reduce){.score.bump,.end,#heroImg{animation:none}.rim,.glow{transition:none}}
</style>
<style>
/* iion mock layer: as a mock the unit always sits on a black letterbox (the game scales its 320×480 stage to the window itself) */
html,body{background:#000}
.btn.demo-press{padding-bottom:1px;transform:translateY(2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),inset 0 -2px 0 #dd9400}
</style>
</head>

  function fxText(x, y, text, look, size){ S.fx.push({ kind:'text', x, y, text, look:look === true ? 'red' : look, size:size || 16, life:0.9, max:0.9 }); }

  /* does segment a→b pass through the piece? work in the piece's own rotated, stretched space */
  function hits(p, ax, ay, bx, by){

    const loc = (x, y) => { const dx = x - p.x, dy = y - p.y; return [(dx * c - dy * s) / hx, (dx * s + dy * c) / hy]; };

  reset();
  /* optional content from the settings block */
  $('ctaLabel').textContent = CONFIG.ctaLabel;
  if(CONFIG.logoSrc){ const l = $('logoImg'); l.src = CONFIG.logoSrc; l.hidden = false; const e = $('endLogo'); e.src = CONFIG.logoSrc; e.hidden = false; $('logoPh').hidden = true; }
  if(CONFIG.headline){ const h = $('headline'); h.textContent = CONFIG.headline; h.hidden = false; }
  if(CONFIG.campaignLine){ const c = $('campaignLine'); c.textContent = CONFIG.campaignLine; c.hidden = false; }
  $('soundBtn').classList.toggle('off', !sound); $('soundBtn').setAttribute('aria-label', sound ? 'Sound on' : 'Sound off'); $('soundBtn').setAttribute('aria-pressed', String(sound));

  /* pause when the ad or tab is not on screen */
  function setPaused(p){ paused = p; if(S){ if(p) endStroke(); } try{ if(AC){ p ? AC.suspend() : AC.resume(); } }catch(e){} }
  document.addEventListener('visibilitychange', () => setPaused(document.hidden));
  if(window.mraid){
    const go = () => { try{ setPaused(!mraid.isViewable()); mraid.addEventListener('viewableChange', v => setPaused(!v)); }catch(e){} };
    try{ if(mraid.getState() === 'loading') mraid.addEventListener('ready', go); else go(); }catch(e){}
  }
  /* iion mock layer hook: lets the demo autopilot (bottom of this file) read the round and move the hand. Not used by ad networks. */
  window.__hotHands = { state:() => S, size:() => ({ W, H }), cfg:CONFIG, startStroke, strokeTo, endStroke, reset, reach };
  track('loaded', {});
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
<script>
/* ══ iion mock layer (playable/_template contract). The game above runs untouched; this drives the demo around it. ══ */
(() => {
const G = window.__hotHands; if (!G) return;
const unit = document.getElementById('stage'), cv = document.getElementById('cv'), el = id => document.getElementById(id);

/* contract: tell the host page where the finger touched (0..1 of the ad unit) → shared/touch.js ripple */
function emitTap(x, y) { try { parent.postMessage({ iionTap: { x, y } }, '*'); } catch (e) {} }
function tapEl(node) { const s = unit.getBoundingClientRect(), r = node.getBoundingClientRect(); emitTap((r.left + r.width / 2 - s.left) / s.width, (r.top + r.height / 2 - s.top) / s.height); }
function tapEvent(e) { const s = unit.getBoundingClientRect(); emitTap((e.clientX - s.left) / s.width, (e.clientY - s.top) / s.height); }
function tapAt(x, y) {                                        // a point in the tub's own coordinates
  const s = unit.getBoundingClientRect(), r = cv.getBoundingClientRect(), z = G.size();
  emitTap((r.left + x / z.W * r.width - s.left) / s.width, (r.top + y / z.H * r.height - s.top) / s.height);
}
function press(node) { tapEl(node); node.classList.add('demo-press'); setTimeout(() => node.classList.remove('demo-press'), 180); }

/* ══ sound: off for the demo, unlocked by the viewer's first touch (through the game's own sound button) ══ */
const soundBtn = el('soundBtn');
let soundUnlocked = false;
function setSound(on) { if ((soundBtn.getAttribute('aria-pressed') === 'true') !== !!on) soundBtn.click(); }

/* ══ slot timeline (autopilot demo) ══ */
const SLOT_MS = 40000;      // nominal length of one demo loop: tutorial swipe, the game's 30 s round, end card
const T_AUTO_PLAY = 2400;   // the bot makes the tutorial swipe once the guide hand has shown it
const T_AUTO_CTA = 2600;    // presses "Find a restaurant" (without opening it) this long after the end card appears
const T_LOOP = 5600;        // and loops back to the start
const SPEED = 0.62;         // the demo hand's speed, tub pixels per millisecond
const T_MISS = 9;           // seconds into the round: the bot leaves one piece alone once, so viewers see a miss
let auto = true, seen = '', seenAt = performance.now(), ctaDone = false, swipe = null, nextAt = 0, missId = 0, missPicked = false;

const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - a.x) * dx + (py - a.y) * dy) / l2, 0, 1) : 0;
  return Math.hypot(a.x + t * dx - px, a.y + t * dy - py);
}
const lengthOf = pts => pts.reduce((n, p, i) => i ? n + Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y) : 0, 0);

/* one swipe: in before the first piece, through each centre, out past the last */
function route(targets) {
  const z = G.size(), n = targets.length, a = targets[0], b = targets[n - 1];
  const dir = (p, q) => { const dx = q.x - p.x, dy = q.y - p.y, d = Math.hypot(dx, dy) || 1; return { x: dx / d, y: dy / d }; };
  const one = { x: a.x < z.W / 2 ? 0.97 : -0.97, y: -0.24 };   // a single piece: swipe towards the middle of the tub
  const din = n > 1 ? dir(a, targets[1]) : one, dout = n > 1 ? dir(targets[n - 2], b) : one;
  const lead = G.reach(a) + 8, tail = G.reach(b) + 8;
  const pts = [{ x: a.x - din.x * lead, y: a.y - din.y * lead }].concat(targets.map(p => ({ x: p.x, y: p.y })), [{ x: b.x + dout.x * tail, y: b.y + dout.y * tail }]);
  pts.forEach(p => { p.x = clamp(p.x, 8, z.W - 8); p.y = clamp(p.y, 8, z.H - 8); });
  return pts;
}
/* a swipe must not touch a finished piece ("Hands off") and must fit in one handful of flour; hot hands lifts both.
   The one piece the bot is leaving alone is always kept off. */
function allowed(pts, S) {
  const hot = S.hotHands > 0;
  if (!hot && lengthOf(pts) > G.cfg.stroke * G.size().W * 0.92) return false;
  const keepOff = S.pieces.filter(p => p.id === missId || (p.done && !hot));
  for (let i = 1; i < pts.length; i++) for (const q of keepOff) if (segDist(q.x, q.y, pts[i - 1], pts[i]) < G.reach(q)) return false;
  return true;
}
/* most urgent piece first, then its nearest neighbours: up to three pieces in one swipe */
function plan(S) {
  if (!missPicked && S.t > T_MISS) {                                            // the scripted miss: the untouched piece closest to running out
    const fresh = S.pieces.filter(p => !p.done && p.coats === 0).sort((p, q) => p.pat - q.pat)[0];
    if (fresh) { missId = fresh.id; missPicked = true; }
  }
  const todo = S.pieces.filter(p => !p.done && p.born <= 0 && p.id !== missId);
  if (!todo.length) return null;
  todo.sort((p, q) => p.pat / p.patMax - q.pat / q.patMax);
  if (todo.length < 2 && todo[0].pat / todo[0].patMax > 0.5) return null;      // wait for a second piece: big swipes build the streak
  const chain = [todo[0]];
  while (chain.length < 3) {
    const last = chain[chain.length - 1];
    const next = todo.filter(p => !chain.includes(p)).sort((p, q) => Math.hypot(p.x - last.x, p.y - last.y) - Math.hypot(q.x - last.x, q.y - last.y))[0];
    if (!next) break;
    chain.push(next);
  }
  for (let n = chain.length; n >= 1; n--) { const pts = route(chain.slice(0, n)); if (allowed(pts, S)) return pts; }
  return null;
}
function begin(pts, now) {
  const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
  const len = cum[cum.length - 1];
  swipe = { pts, cum, len, t0: now, dur: Math.max(280, len / SPEED), down: false, fed: 0, rip: 0 };
}
function step(now, S) {
  const w = swipe;
  if (S.phase === 'over') { swipe = null; return; }
  const e = Math.min(1, (now - w.t0) / w.dur), d = e * w.len;
  let i = 1; while (i < w.cum.length - 1 && w.cum[i] < d) i++;
  const a = w.pts[i - 1], b = w.pts[i], k = (d - w.cum[i - 1]) / ((w.cum[i] - w.cum[i - 1]) || 1);
  const x = a.x + (b.x - a.x) * k, y = a.y + (b.y - a.y) * k;
  if (!w.down) { w.down = true; G.startStroke(x, y); }
  else {
    while (w.fed < i - 1) { w.fed++; G.strokeTo(w.pts[w.fed].x, w.pts[w.fed].y); }   // never cut a corner between frames
    G.strokeTo(x, y);
  }
  if (now - w.rip > 150) { w.rip = now; tapAt(x, y); }
  if (e >= 1) { G.endStroke(); swipe = null; nextAt = now + 360 + Math.random() * 240; }
}

function release() { if (swipe) { swipe = null; G.endStroke(); } }
function takeOver() { if (!auto) return; auto = false; release(); }
function start() { release(); auto = true; ctaDone = false; missId = 0; missPicked = false; G.reset(); seen = ''; seenAt = performance.now(); }

function tick(now) {
  requestAnimationFrame(tick);
  const S = G.state(); if (!S) return;
  if (S.phase !== seen) { seen = S.phase; seenAt = now; ctaDone = false; }      // 'ready' · 'play' · 'over'
  if (!auto) return;
  if (swipe) { step(now, S); return; }
  const t = now - seenAt;
  if (S.phase === 'ready') { if (t > T_AUTO_PLAY && S.pieces.length >= 3) begin(route(S.pieces.slice(0, 3)), now); }
  else if (S.phase === 'play') { if (now >= nextAt) { const pts = plan(S); if (pts) begin(pts, now); else nextAt = now + 120; } }
  else if (S.phase === 'over') {
    if (!ctaDone && t > T_AUTO_CTA) { ctaDone = true; press(el('ctaBtn')); }
    if (t > T_LOOP) start();
  }
}

/* A real touch, click or key takes over from the demo and (once) turns the sound on. */
addEventListener('pointerdown', e => {
  if (!e.isTrusted) return;
  tapEvent(e); takeOver();
  if (!soundUnlocked) { soundUnlocked = true; if (!(e.target.closest && e.target.closest('#soundBtn'))) setSound(true); }
}, true);
addEventListener('keydown', e => { if (e.isTrusted) takeOver(); }, true);
/* while the demo hand is swiping, a mouse that only hovers over the tub must not drag the demo's swipe with it */
addEventListener('pointermove', e => { if (e.isTrusted && auto && swipe) e.stopPropagation(); }, true);
/* An ad server's clickTag wins over the configured destination. */
addEventListener('click', e => { if (window.clickTag && e.target.closest && e.target.closest('#ctaBtn,#heroBtn')) G.cfg.clickUrl = window.clickTag; }, true);

window.DEMO = { start, slotMs: SLOT_MS, setAuto: v => { auto = !!v; if (!auto) release(); }, setSound: on => { soundUnlocked = true; setSound(on); } };
requestAnimationFrame(tick);
})();
</script>
