<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BlackBear – Wife and Dog · CTV ad break</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,800&display=swap">
<script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embed');</script>
<style>
/* CTV ad break (from the ad-banner-screenshot-generator CTV mock): programme → the ad with a countdown band → programme, looping.
   The countdown reads the ad's own duration, so a different spot needs no code change. */
html,body{margin:0;height:100%;background:#000;overflow:hidden}
.screen{position:fixed;left:50%;top:50%;width:min(100vw,177.78vh);height:min(100vh,56.25vw);transform:translate(-50%,-50%);background:#000;overflow:hidden;container-type:size}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;transition:none}
.screen video.on{opacity:1}
/* the generator's band: 12px on a 575px-wide screen, 60% black, white Nunito Sans ExtraBold 7px */
.band{position:absolute;left:0;right:0;top:0;height:3.71cqh;background:rgba(0,0,0,.6);color:#fff;display:flex;align-items:center;justify-content:center;
  font:800 1.22cqw/1 "Nunito Sans",sans-serif;letter-spacing:.01em;opacity:0;z-index:2;pointer-events:none}
.band.on{opacity:1}
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="band" id="band"><span>Your game will continue in <span id="secs">&nbsp;</span> seconds</span></div>
</div>
<script>
const CLIPS = [
  { id:'pre',  src:'assets/game-first.mp4' },   // programme before the break
  { id:'ad',   src:'assets/ad.mp4' },      // the brand spot
  { id:'post', src:'assets/game-second.mp4' },  // programme after the break
];
const bust = u => { const v = new URLSearchParams(location.search).get('v'); return u && v ? u + (u.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(v) : u; };   // the page's ?v reaches the files too (cache-busting)
const screen = document.getElementById('screen'), band = document.getElementById('band'), secs = document.getElementById('secs');
let sound = false, cur = -1, raf = 0;
const vids = CLIPS.map(c => {
  const v = document.createElement('video');
  v.muted = true; v.defaultMuted = true; v.setAttribute('muted',''); v.playsInline = true; v.setAttribute('playsinline','');
  v.preload = 'auto'; v.src = bust(c.src);
  v.addEventListener('ended', () => { if (vids.indexOf(v) === cur) play((cur + 1) % vids.length); });
  screen.insertBefore(v, band); return v;
});
function play(i) {
  vids.forEach((v, k) => { if (k !== i) { v.pause(); v.classList.remove('on'); } });
  cur = i; const v = vids[i];
  v.muted = !sound; try { v.currentTime = 0; } catch (e) {}
  const p = v.play(); if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); });
  v.classList.add('on');
  band.classList.toggle('on', CLIPS[i].id === 'ad');
}
function tick() {
  const v = vids[cur];
  if (v && CLIPS[cur].id === 'ad') {
    const d = isFinite(v.duration) ? v.duration : 0;
    secs.textContent = Math.max(0, Math.ceil(d - v.currentTime));
  }
  raf = requestAnimationFrame(tick);
}
function start() { play(0); cancelAnimationFrame(raf); tick(); }
function setSound(on) { sound = !!on; vids.forEach((v, k) => { v.muted = !(sound && k === cur); }); }
const slotMs = () => vids.reduce((t, v) => t + (isFinite(v.duration) ? v.duration * 1000 : 0), 0);
window.DEMO = { start, get slotMs() { return slotMs(); }, setAuto: () => {}, setSound };
start();
</script>
</body>
</html>
