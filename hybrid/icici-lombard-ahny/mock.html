<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ICICI Lombard Street Quiz</title>
  <!--
    ════════════════════════════════════════════════════════════════════
    HYBRID POLL — ready-to-use starter.  Video on top (37%) + poll (63%).
    You only need to touch TWO blocks, both marked  ▸ EDIT ME ◂  below:
      1. :root  (THEME)  — brand colours
      2. CONFIG (bottom) — questions, options, copy
    …then drop your clip in as  video.mp4  next to this file.
    Everything else (2:3 frame, mute button, poll logic) is already wired —
    leave it alone.  Full instructions: see START-HERE.md.
    ════════════════════════════════════════════════════════════════════
  -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap');

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    [hidden] { display: none !important; }   /* so `hidden` still wins over display:flex rules */

    /* ══════════════════════════════════════════════════════════════
       ▸ EDIT ME ◂  THEME
       Change --accent + the surface/text colours to the brand.
       Every tint/border below --success follows --accent automatically
       (via color-mix) — you do NOT need to touch them.
       NOTE: --accent must be dark enough that WHITE text on it is legible
       (it's used behind white numbers and the active button).
       ══════════════════════════════════════════════════════════════ */
    :root {
      --accent: #F24C0D;         /* ICICI Lombard orange (sampled from the design mock) */
      --accent-light: #FD671A;   /* lighter orange — top of the CTA gradient */
      --navy: #002C77;           /* question + option text, stepper */

      --bg: #FDF6F1;            /* poll gradient — bottom */
      --bg-card: #FFFFFF;        /* poll gradient — top */
      --bg-option: #FFFFFF;      /* option row background */
      --bg-option-hover: #FFF3EA;/* option row hover */

      --text: #002C77;           /* main text colour (navy) */
      --text-muted: #5F6B85;     /* secondary text */

      --video-bg: #000;          /* letterbox behind the video */
      --success: #1E8E5A;        /* correct-answer colour after voting */
      --danger: #D8392B;         /* wrong-answer colour after voting */

      /* ── Derived tints (leave as-is; they follow --accent) ── */
      --accent-glow: color-mix(in srgb, var(--accent) 30%, transparent);
      --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
      --accent-softer: color-mix(in srgb, var(--accent) 12%, transparent);
      --accent-cta: color-mix(in srgb, var(--accent) 20%, transparent);
      --border: color-mix(in srgb, var(--accent) 15%, transparent);
      --border-hover: color-mix(in srgb, var(--accent) 35%, transparent);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: 'Mulish', system-ui, sans-serif;
      background: #000;
      color: var(--text);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ── Proportional scale: 1 unit = 1px on a 360px-wide canvas, growing with the canvas width.
       Everything in the poll is sized from --u so the layout is identical at every size
       (phone or desktop) and the last answer row can never be pushed out of the frame. ── */
    :root {
      --cw: min(100vw, calc(100vh * 2 / 3));
      --u: calc(var(--cw) / 360);
    }

    @supports (height: 100dvh) {
      :root { --cw: min(100vw, calc(100dvh * 2 / 3)); }
    }

    .container {
      /* 2:3 ad frame — fills the viewport by whichever dimension is limiting,
         keeping ratio. Black letterbox (body bg) fills the rest.
         DO NOT CHANGE — this is the house framing. */
      aspect-ratio: 2 / 3;
      width: min(100vw, calc(100vh * 2 / 3));     /* fallback for browsers without dvh */
      width: min(100vw, calc(100dvh * 2 / 3));
      height: auto;
      max-height: 100vh;
      max-height: 100dvh;
      margin: auto;                                /* always centred, even if the flex centring is overridden */
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── VIDEO AREA (37%) — autoplays muted on load ── */
    .video-area {
      height: 37%;
      position: relative;
      background: var(--video-bg);
      overflow: hidden;
      flex-shrink: 0;
    }

    .video-label {
      position: absolute;
      top: clamp(6px, 1.5vw, 14px);
      left: clamp(6px, 1.5vw, 14px);
      background: var(--accent);
      color: #fff;
      font-size: clamp(8px, 2vw, 14px);
      font-weight: 600;
      padding: clamp(2px, 0.5vw, 5px) clamp(6px, 1.5vw, 12px);
      border-radius: clamp(3px, 0.8vw, 6px);
      z-index: 2;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      opacity: 0;
    }

    .video-area video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mute-btn {
      position: absolute;
      top: clamp(8px, 2vw, 14px);
      right: clamp(8px, 2vw, 14px);
      width: clamp(28px, 7vw, 40px);
      height: clamp(28px, 7vw, 40px);
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #fff;
      cursor: pointer;
      z-index: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
    }

    .mute-btn:hover {
      background: rgba(0, 0, 0, 0.7);
    }

    .mute-btn svg {
      width: clamp(14px, 3.5vw, 20px);
      height: clamp(14px, 3.5vw, 20px);
      fill: #fff;
    }

    /* ── POLL AREA (63%, starts exactly where the video ends — no overlap) — visible immediately ──
       All sizes are u(N) = N px on a 360px-wide canvas, scaling with the canvas. */
    .poll-area {
      height: 63%;
      padding: calc(var(--u) * 14) calc(var(--u) * 16) 0;
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg) 100%);
      overflow: hidden;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
    }

    .poll-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
      padding-bottom: calc(var(--u) * 34);   /* swoosh (24u) + 10u clearance, so the last answer never touches it */
    }

    /* logo (left) + progress stepper (right) */
    .poll-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .brand-logo {
      height: calc(var(--u) * 32);
      width: auto;
      display: block;
    }

    /* 1 — 2 — 3 progress: orange = current, green = answered right, red = answered wrong */
    .stepper {
      list-style: none;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-shrink: 0;
      isolation: isolate;                /* lets the connector sit BEHIND the circles */
    }

    .stepper li {
      width: calc(var(--u) * 15);
      height: calc(var(--u) * 15);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: calc(var(--u) * 9);
      font-weight: 800;
      color: #8A94A8;
      background: #fff;
      border: calc(var(--u) * 1.2) solid #D5DBE6;
      transition: background 0.25s, border-color 0.25s;
    }

    .stepper li + li { margin-left: calc(var(--u) * 14); position: relative; }

    .stepper li + li::before {            /* connector line */
      content: '';
      position: absolute;
      z-index: -1;                        /* behind the circles, so it never cuts into them */
      right: calc(100% + var(--u) * 3.7);  /* 2.5u gap (+1.2u border) so the line never touches a dot */
      top: 50%;
      width: calc(var(--u) * 9);
      height: calc(var(--u) * 1.5);
      margin-top: calc(var(--u) * -0.75);
      background: #E3E8F1;
    }

    .stepper li.active,
    .stepper li.right,
    .stepper li.wrong {
      color: #fff;
      border-color: transparent;
    }

    .stepper li.active { background: linear-gradient(180deg, var(--accent-light), var(--accent)); }
    .stepper li.right  { background: var(--success); }
    .stepper li.wrong  { background: var(--danger); }

    /* the swappable part (question + answers, or the final thank-you) — fades between screens */
    .poll-body {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      transition: opacity 0.12s ease;
    }

    .poll-body.swap { opacity: 0; }

    /* min-height = 3 lines, text centred in it, so 2-line and 3-line questions share the same layout */
    .question {
      margin-top: calc(var(--u) * 20);
      min-height: calc(var(--u) * 56);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--u) * 15.5);
      font-weight: 800;
      line-height: 1.2;
      text-align: center;
      color: var(--navy);
      flex-shrink: 0;
    }

    .question .q-text { display: block; }
    .question .hl { color: var(--accent); }

    .poll-options {
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 7);
      margin-top: calc(var(--u) * 14);
    }

    .poll-option {
      position: relative;
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 12);
      padding: calc(var(--u) * 4) calc(var(--u) * 12);
      min-height: calc(var(--u) * 36);
      background: var(--bg-option);
      border: calc(var(--u) * 1.2) solid #E3E8F1;
      border-radius: calc(var(--u) * 11);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    /* hover tint only where a real pointer exists — on touch screens it would stick after a tap */
    @media (hover: hover) {
      .poll-option:hover { background: var(--bg-option-hover); }
    }

    .poll-option:active { background: #FFF4EC; border-color: #F58A4B; }

    .poll-option .letter {
      width: calc(var(--u) * 26);
      height: calc(var(--u) * 26);
      border-radius: 50%;
      background: #EEF1F6;
      color: var(--navy);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: calc(var(--u) * 13);
      flex-shrink: 0;
      transition: background 0.2s, color 0.2s;
    }

    .poll-option .label {
      font-size: calc(var(--u) * 14.5);
      font-weight: 600;
      color: var(--navy);
      flex: 1;
    }

    .poll-option.voted { cursor: default; pointer-events: none; }

    /* the moment you tap: the right answer is green; your pick is red if it was wrong.
       A ✓ / ✕ is shown too, so it isn't colour-only. */
    .poll-option.correct { background: #EAF6EF; border-color: var(--success); }
    .poll-option.wrong   { background: #FDEDEB; border-color: var(--danger); }
    .poll-option.correct .letter { background: var(--success); color: #fff; }
    .poll-option.wrong   .letter { background: var(--danger);  color: #fff; }

    .poll-option.correct::after,
    .poll-option.wrong::after {
      font-size: calc(var(--u) * 15);
      font-weight: 800;
      line-height: 1;
    }
    .poll-option.correct::after { content: '✓'; color: var(--success); }
    .poll-option.wrong::after   { content: '✕'; color: var(--danger); }

    /* ── results frame (after the last answer): your score + how everyone did, one bar per score ── */
    .results {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.35s ease;
      cursor: pointer;
    }

    .results.show { opacity: 1; }

    .res-score {
      margin-top: calc(var(--u) * 12);
      font-size: calc(var(--u) * 21);
      font-weight: 800;
      line-height: 1.15;
      text-align: center;
      color: var(--navy);
    }

    .res-score .hl { color: var(--accent); }

    .res-sub {
      margin-top: calc(var(--u) * 4);
      font-size: calc(var(--u) * 12.5);
      font-weight: 700;
      text-align: center;
      color: var(--text-muted);
    }

    .res-list {
      list-style: none;
      margin-top: calc(var(--u) * 11);
      display: flex;
      flex-direction: column;
      gap: calc(var(--u) * 6);
    }

    .res-row {
      display: grid;
      grid-template-columns: calc(var(--u) * 92) 1fr calc(var(--u) * 38);
      align-items: center;
      gap: calc(var(--u) * 8);
      min-height: calc(var(--u) * 31);
      padding: 0 calc(var(--u) * 12);
      background: #fff;
      border: calc(var(--u) * 1.2) solid #E3E8F1;
      border-radius: calc(var(--u) * 11);
    }

    .res-row.you { border-color: var(--accent); background: #FFF6F0; }

    .res-label {
      display: flex;
      align-items: center;
      gap: calc(var(--u) * 6);
      font-size: calc(var(--u) * 13);
      font-weight: 800;
      color: var(--navy);
      white-space: nowrap;
    }

    .res-label em {
      font-style: normal;
      font-size: calc(var(--u) * 9);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fff;
      background: var(--accent);
      padding: calc(var(--u) * 2) calc(var(--u) * 6);
      border-radius: 999px;
    }

    .res-bar {
      height: calc(var(--u) * 8);
      border-radius: 999px;
      background: #EEF1F6;
      overflow: hidden;
    }

    .res-bar i {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: #9AA8C4;
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .res-row.you .res-bar i { background: linear-gradient(90deg, var(--accent-light), var(--accent)); }

    .res-pct {
      text-align: right;
      font-size: calc(var(--u) * 13);
      font-weight: 800;
      color: var(--navy);
    }

    /* the CTA under the results (the end frame when thanksFrame is off); sits at the bottom of the free space */
    .results .visit { margin-top: auto; }
    .results:not(.end) .visit { display: none; }
    .results.end { cursor: default; }
    .results.end .res-list { margin-bottom: calc(var(--u) * 12); }

    /* ── final screen: shield illustration, heading, Visit Website button; bigger swoosh ── */
    .poll-area.final {
      background:
        radial-gradient(ellipse 85% 42% at 50% 56%, #E9F1FC 0%, rgba(233, 241, 252, 0) 100%),
        linear-gradient(180deg, var(--bg-card) 0%, var(--bg) 100%);
    }

    .poll-area.final .poll-content { padding-bottom: calc(var(--u) * 50); }   /* room for the taller swoosh */
    .poll-area.final .swoosh { height: calc(var(--u) * 44); }

    .thanks {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .thanks.show { opacity: 1; }

    .thanks .trophy {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      object-fit: contain;   /* the supplied shield artwork (transparent PNG), scaled to the free space */
      transform: scale(0.92);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .thanks.show .trophy { transform: scale(1); }

    .thanks-text {
      margin-top: calc(var(--u) * 2);
      font-size: calc(var(--u) * 25);
      font-weight: 800;
      line-height: 1.1;
      color: var(--navy);
      text-align: center;
      flex-shrink: 0;
    }

    .visit {
      margin-top: calc(var(--u) * 10);
      align-self: stretch;
      height: calc(var(--u) * 38);
      border-radius: 999px;
      background: linear-gradient(180deg, var(--accent-light), #E93B05);
      color: #fff;
      font-size: calc(var(--u) * 17);
      font-weight: 800;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: calc(var(--u) * 9);
      flex-shrink: 0;
    }

    .visit span { font-size: 1.5em; line-height: 0.6; font-weight: 700; }

    /* decorative corner swoosh (orange sweep + navy corner), behind the content */
    .swoosh {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(var(--u) * 24);
      z-index: 0;
      transition: height 0.4s ease;
      pointer-events: none;
    }

    /* Loader (as the Employment Hero unit): covers the quiz until its logo, font and end-card art are in, so the quiz
       never shows in a fallback font or without its logo. The video starts downloading only after it (poster meanwhile). */
    .loader {
      position: absolute; inset: 0; z-index: 5;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 22);
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg) 100%);
      transition: opacity .45s ease;
    }
    .loader.done { opacity: 0; pointer-events: none; }
    .loader img { width: calc(var(--u) * 170); height: auto; display: block; animation: pulse 1.4s ease-in-out infinite; }
    .loader .bar { width: calc(var(--u) * 140); height: calc(var(--u) * 4); border-radius: 999px; background: #EEF1F6; overflow: hidden; }
    .loader .bar i { display: block; width: 0; height: 100%; border-radius: inherit;
      background: linear-gradient(90deg, var(--accent-light), var(--accent)); transition: width .25s ease; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.04); opacity: .82; } }

    @media (prefers-reduced-motion: reduce) {
      .loader img { animation: none; }
      .results,
      .res-bar i,
      .poll-body,
      .thanks,
      .thanks .trophy,
      .swoosh,
      .poll-option,
      .stepper li { transition: none; }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- VIDEO — autoplays muted, loops -->
    <div class="video-area">
      <div class="video-label"></div>
      <video id="video" autoplay muted loop playsinline preload="none" poster="assets/poster.jpg"></video>
      <button class="mute-btn" id="muteBtn" onclick="toggleMute()">
        <svg id="muteIcon" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        <svg id="unmuteIcon" viewBox="0 0 24 24" style="display:none"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>
    </div>

    <!-- POLL — shown immediately -->
    <div class="poll-area">
      <svg class="swoosh" viewBox="0 0 360 24" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="sw" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#FD671A" />
            <stop offset="1" stop-color="#F24C0D" />
          </linearGradient>
        </defs>
        <!-- navy first (its top edge tucks under the orange), then the orange band on top: one arc, two colours -->
        <path d="M0 13.6 Q180 21.6 360 5.6 L360 24 L0 24 Z" fill="#002C77" />
        <path d="M0 6 Q170 14 360 0 L360 6 Q180 22 0 14 Z" fill="url(#sw)" />
      </svg>
      <div class="poll-content">
        <div class="poll-top">
          <img class="brand-logo" src="assets/logo.webp" alt="ICICI Lombard General Insurance">
          <ol class="stepper" id="stepper" aria-label="Question progress"></ol>
        </div>

        <div class="poll-body" id="pollBody">
          <h2 class="question" id="question"></h2>
          <div class="poll-options" id="pollOptions"></div>
          <div class="results" id="results" role="status" hidden>
            <div class="res-score" id="resScore"></div>
            <div class="res-sub" id="resSub"></div>
            <ol class="res-list" id="resList"></ol>
            <a class="visit" id="resVisit" target="_blank" rel="noopener noreferrer"><b id="resVisitLabel"></b><span>›</span></a>
          </div>
          <div class="thanks" id="thanks" role="status" hidden>
            <img class="trophy" data-src="assets/shield.webp" alt="" width="960" height="666">
            <div class="thanks-text" id="thanksText"></div>
            <a class="visit" id="visit" target="_blank" rel="noopener noreferrer"><b id="visitLabel"></b><span>›</span></a>
          </div>
        </div>
      </div>
      <div class="loader" id="loader" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
        <img src="assets/logo.webp" alt="ICICI Lombard General Insurance">
        <div class="bar"><i id="loadBar"></i></div>
      </div>
    </div>

  </div>

  <script>
    /* ══════════════════════════════════════════════════════════════
       ▸ EDIT ME ◂  COPY & DATA
       This is the whole poll. Change the text and the options, and mark
       the right answer of each question with  correct: true.
       ══════════════════════════════════════════════════════════════ */
    const CONFIG = {
      videoSrc: 'assets/video.mp4',       // your clip — put the file in THIS folder, named video.mp4
      videoLabel: 'Live Clip',     // small pill top-left (hidden by default; set opacity in CSS to show)

      // ⚠ TIP: use "double quotes" for any label containing an apostrophe (e.g. "I'm")
      // highlight = the part of the question shown in orange.
      // correct: true marks the right answer (green after voting; a wrong pick turns red).
      questions: [
        {
          prompt: 'ICICI Lombard primarily operates in which segment of the insurance industry?',
          highlight: 'insurance industry?',
          options: [
            { label: 'Life Insurance' },
            { label: 'General Insurance', correct: true },
            { label: 'Reinsurance' },
            { label: 'Pension Insurance' },
          ],
        },
        {
          prompt: 'Which of the following is NOT a direct competitor of ICICI Lombard in the general insurance category?',
          highlight: 'general insurance category?',
          options: [
            { label: 'Tata AIG' },
            { label: 'Bajaj Allianz General Insurance' },
            { label: 'SBI General Insurance' },
            { label: 'ICICI Prudential Life Insurance', correct: true },
          ],
        },
        {
          prompt: 'ICICI Lombard competes most closely with which of the following digital-first insurance brands?',
          highlight: 'digital-first insurance brands?',
          options: [
            { label: 'ACKO', correct: true },
            { label: 'Zerodha' },
            { label: 'Policybazaar' },
            { label: 'CRED' },
          ],
        },
      ],
      advanceDelayMs: 750,        // pause after an answer (green/red shown) before the next question

      // Results frame after the last answer: your score, then how everyone did.
      // crowd = % of players who got 3, 2, 1 and 0 right. Illustrative in this mock; live, these come from the ad server.
      resultsSub: 'How everyone did',
      crowd: [34, 41, 19, 6],
      resultsMs: 4500,            // with thanksFrame: how long the results frame stays before the thank-you (a tap skips ahead)
      thanksFrame: false,         // false = the results frame is the end frame, with the Visit Website button under the results;
                                  // true = results, then the separate shield + "Thanks for playing!" frame with the button
      thanksLabel: 'Thanks for playing!',
      websiteLabel: 'Visit Website',                  // button on the final screen
      websiteUrl: 'https://www.icicilombard.com/',    // where it goes (opens in a new tab)
    };

    /* ── Wiring (you shouldn't need to edit below) ── */
    const $ = (s) => document.querySelector(s);
    const video = document.getElementById('video');
    $('.video-label').textContent = CONFIG.videoLabel;

    // Loader: the quiz's logo, its font and the end-card shield get the bandwidth first (errors count, 10 s cap);
    // then the loader fades and the video (the heavy file) starts. ?slow staggers the loads to see the loader.
    (function () {
      const SLOW = new URLSearchParams(location.search).has('slow');
      const wait = (ms) => new Promise((r) => setTimeout(r, SLOW ? ms : 0));
      const img = (src) => new Promise((r) => { const im = new Image(); im.onload = im.onerror = r; im.src = src; });
      const font = () => (document.fonts ? Promise.all(['800 15px Mulish', '600 15px Mulish'].map((f) => document.fonts.load(f))).catch(() => {}) : null);
      const jobs = [() => img('assets/logo.webp'), font];
      if (CONFIG.thanksFrame) jobs.push(() => img('assets/shield.webp'));   // the shield only exists on the thank-you frame
      const bust = u => { const v = new URLSearchParams(location.search).get('v'); return u && v ? u + (u.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(v) : u; };   // the page's ?v reaches the files too (cache-busting)
      let done = 0, ready = false;
      function reveal() {
        if (ready) return; ready = true;
        setTimeout(() => {                                   // let the bar visibly reach 100%
          const l = document.getElementById('loader'); l.classList.add('done');
          setTimeout(() => { l.hidden = true; }, 500);
          video.preload = 'auto'; video.src = bust(CONFIG.videoSrc);
          video.load(); video.play().catch(() => {});
        }, 250);
      }
      jobs.forEach((job, i) => wait((i + 1) * 600).then(job).then(() => {
        done++;
        const pct = Math.round(done / jobs.length * 100);
        document.getElementById('loadBar').style.width = pct + '%';
        document.getElementById('loader').setAttribute('aria-valuenow', pct);
        if (done === jobs.length) reveal();
      }));
      setTimeout(reveal, 10000);
    })();
    video.addEventListener('canplay', () => { if (video.paused) video.play().catch(() => {}); }, { once: true });

    const body = document.getElementById('pollBody');
    let qi = 0, answered = false;
    const results = [];                    // per question: 'right' | 'wrong' once answered

    // 1 — 2 — 3 progress: current = orange, answered = green (right) / red (wrong)
    function renderStepper() {
      $('#stepper').innerHTML = CONFIG.questions.map((_, i) => {
        const state = results[i] || (i === qi ? 'active' : '');
        const glyph = state === 'right' ? '✓' : state === 'wrong' ? '✕' : i + 1;
        return `<li class="${state}"${i === qi ? ' aria-current="step"' : ''}>${glyph}</li>`;
      }).join('');
    }

    // text with one part picked out in orange (used by the question and the thank-you message)
    function highlighted(text, part) {
      const frag = document.createDocumentFragment();
      const at = part ? text.indexOf(part) : -1;
      if (at < 0) { frag.append(text); return frag; }
      const hl = document.createElement('span');
      hl.className = 'hl';
      hl.textContent = part;
      frag.append(text.slice(0, at), hl, text.slice(at + part.length));
      return frag;
    }

    function renderQuestion() {
      const q = CONFIG.questions[qi];
      answered = false;

      const text = document.createElement('span');
      text.className = 'q-text';
      text.append(highlighted(q.prompt, q.highlight));
      $('#question').replaceChildren(text);

      renderStepper();

      document.getElementById('pollOptions').innerHTML = q.options.map((o, i) => `
        <div class="poll-option" data-value="${i + 1}" role="button" tabindex="0"
             onclick="answer(this)" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); answer(this); }">
          <div class="letter">${String.fromCharCode(65 + i)}</div>
          <div class="label">${o.label}</div>
        </div>`).join('');
    }
    renderQuestion();

    // results frame: your score + one bar per score (3, 2, 1, 0 right), your row picked out; the stepper still shows ✓ / ✕
    let resultsTimer = 0;
    function showResults() {
      const n = CONFIG.questions.length;
      const right = results.filter((r) => r === 'right').length;
      $('#question').hidden = true;
      $('#pollOptions').hidden = true;
      $('#resScore').replaceChildren(right === n
        ? highlighted(`Perfect! ${n} of ${n} right`, `${n} of ${n}`)
        : highlighted(`You got ${right} of ${n} right`, `${right} of ${n}`));
      $('#resSub').textContent = CONFIG.resultsSub;
      $('#resList').innerHTML = CONFIG.crowd.map((pct, i) => {
        const score = n - i, you = score === right;
        return `<li class="res-row${you ? ' you' : ''}">
            <span class="res-label">${score} of ${n}${you ? '<em>You</em>' : ''}</span>
            <span class="res-bar"><i data-w="${pct}"></i></span>
            <span class="res-pct">${pct}%</span>
          </li>`;
      }).join('');
      const r = $('#results');
      if (!CONFIG.thanksFrame) {             // end frame: the CTA comes with the results
        $('#resVisitLabel').textContent = CONFIG.websiteLabel;
        $('#resVisit').href = CONFIG.websiteUrl;
        r.classList.add('end');
      }
      r.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        r.classList.add('show');
        r.querySelectorAll('.res-bar i').forEach((b) => { b.style.width = b.dataset.w + '%'; });
      }));
      if (CONFIG.thanksFrame) resultsTimer = setTimeout(leaveResults, CONFIG.resultsMs);
    }

    function leaveResults(e) {
      if (e && e.target.closest && e.target.closest('.visit')) return;
      if (!resultsTimer) return;
      clearTimeout(resultsTimer); resultsTimer = 0;
      body.classList.add('swap');
      setTimeout(() => { $('#results').hidden = true; showThanks(); body.classList.remove('swap'); }, 130);
    }
    $('#results').addEventListener('click', leaveResults);

    // final screen: shield + heading + Visit Website replace the question, answers and progress stepper
    function showThanks() {
      $('#stepper').hidden = true;
      $('#question').hidden = true;
      $('#pollOptions').hidden = true;
      $('.poll-area').classList.add('final');
      $('#thanksText').textContent = CONFIG.thanksLabel;
      $('#visitLabel').textContent = CONFIG.websiteLabel;
      $('#visit').href = CONFIG.websiteUrl;
      const sh = $('#thanks .trophy'); if (!sh.getAttribute('src')) sh.src = sh.dataset.src;
      const t = $('#thanks');
      t.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
    }

    // fade out → swap to the next question (or the thank-you) → fade in
    function advance() {
      body.classList.add('swap');
      setTimeout(() => {
        if (qi < CONFIG.questions.length - 1) { qi++; renderQuestion(); }
        else showResults();
        body.classList.remove('swap');
      }, 130);
    }

    // Mute toggle
    const muteIcon = document.getElementById('muteIcon');
    const unmuteIcon = document.getElementById('unmuteIcon');
    function toggleMute() {
      video.muted = !video.muted;
      muteIcon.style.display = video.muted ? 'block' : 'none';
      unmuteIcon.style.display = video.muted ? 'none' : 'block';
    }

    // Tapping an answer reveals right/wrong at once, then moves on by itself after a short pause
    function answer(el) {
      if (answered) return;
      answered = true;

      const opts = CONFIG.questions[qi].options;
      const picked = Number(el.dataset.value) - 1;
      results[qi] = opts[picked].correct ? 'right' : 'wrong';
      document.querySelectorAll('.poll-option').forEach((opt, i) => {
        opt.classList.add('voted');
        if (opts[i].correct) opt.classList.add('correct');       // right answer → green
        else if (i === picked) opt.classList.add('wrong');       // your wrong pick → red
      });
      renderStepper();

      setTimeout(advance, CONFIG.advanceDelayMs);
    }
  </script>
</body>

</html>
