<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="../../shared/mobile.js?v=7"></script>
<meta name="robots" content="noindex,nofollow">
<title>iion · Burger King UK rewarded video + playable end card</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../shared/favicon-32.png"><link rel="icon" type="image/png" sizes="64x64" href="../../shared/favicon-64.png"><link rel="apple-touch-icon" href="../../shared/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../shared/page.css?v=11">
<link rel="stylesheet" href="../../shared/phone.css?v=8">
<style>
/* the unit fills the phone's screen (the game and the 9:16 video are full screen; the playable end card draws its own 2:3 slot
   with black bars inside the unit); .fill keeps mobile.js from snapping the slot to 2:3 */
.phone .ad-slot.fill{inset:0;top:0;aspect-ratio:auto;transform:none}
/* room for the sound button under the phone, so the page stays one screen tall */
.stage.phone-stage > .phone{width:min(100cqw,(100cqh - 64px) * 0.4735);margin-bottom:64px}
@media (max-width:700px){.stage.phone-stage > .phone{width:min(100%,(100svh - 220px) * 0.4735);margin:0 auto 64px}}
.phone .controls{white-space:nowrap}
</style>
</head>
<body>
<nav class="nav"><img src="../../shared/iion-logo.png?v=2" alt="iion"></nav>

<section class="hero">
  <div class="eyebrow">Rewarded video + playable end card · Burger King UK</div>
  <h1>Foodfillment.</h1>
  <p>A portrait rewarded video: the game, the 30-second Burger King UK video with the reward countdown, then the Burger King UK playable as the end card.</p>
</section>

<section class="stage phone-stage">
  <div class="phone">
    <div class="screen">
      <div class="ad-slot fill" data-full="mock.html?full=1"><iframe src="mock.html?embed=1&amp;round" title="rewarded video ad with a playable end card" allow="autoplay"></iframe><script>{const v=new URLSearchParams(location.search).get("v"),f=document.currentScript.previousElementSibling;if(v&&f&&f.tagName==="IFRAME")f.src=f.getAttribute("src")+"&v="+encodeURIComponent(v);}</script></div>
      <div class="statusbar"><span>9:41</span><span class="icons">
        <svg viewBox="0 0 18 12" fill="#fff" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
        <svg viewBox="0 0 17 12" fill="#fff" aria-hidden="true"><path d="M8.5 11.6L5.95 9.05A3.6 3.6 0 0 1 11.05 9.05ZM3.27 6.37A7.4 7.4 0 0 1 13.73 6.37L12.04 8.06A5.0 5.0 0 0 0 4.96 8.06ZM0.58 3.68A11.2 11.2 0 0 1 16.42 3.68L14.72 5.38A8.8 8.8 0 0 0 2.28 5.38Z"/></svg>
        <svg viewBox="0 0 27 12" fill="none" aria-hidden="true"><rect x=".5" y=".5" width="23" height="11" rx="3.2" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="18" height="8" rx="2" fill="#fff"/><path d="M25 4v4c.8-.3 1.3-1.1 1.3-2S25.8 4.3 25 4z" fill="#fff" fill-opacity=".5"/></svg>
      </span></div>
      <div class="island"></div>
      <div class="homebar"></div>
    </div>
    <i class="hw hw-action"></i><i class="hw hw-vol1"></i><i class="hw hw-vol2"></i><i class="hw hw-power"></i>
    <div class="floor"></div>
  </div>
  <div class="controls"><button class="snd" id="snd" type="button"></button></div>
</section>

<script>
  const ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
  const OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
  const f=document.querySelector('iframe'), b=document.getElementById('snd'); let on=false;
  function paint(){ b.classList.toggle('on',on); b.innerHTML=(on?ON:OFF)+(on?'Sound on':'Turn sound on'); }
  b.addEventListener('click',()=>{ on=!on; try{ const w=f.contentWindow; if(w.DEMO&&w.DEMO.setSound) w.DEMO.setSound(on); }catch(e){} paint(); });
  addEventListener('message',e=>{ if(e.data&&typeof e.data.iionSound==='boolean'){ on=e.data.iionSound; paint(); } });   // a tap or the ad's own speaker
  paint();
</script>
<script src="../../shared/touch.js?v=3"></script>
<script src="../../shared/theme.js?v=6"></script>
</body>
</html>
