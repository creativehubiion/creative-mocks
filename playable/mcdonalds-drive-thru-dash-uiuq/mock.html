const inBox=(p,b)=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=toLocal(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({iionTap:{x:e.clientX,y:e.clientY}},'*');}catch(_){} /* the creative-mocks phone frame draws a ripple from it */
  if(S.scene==='splash'){if(splashReady()){start('play');if(QS.has('howto'))G.howto();}return;} /* the scene teaches the flick; ?howto shows the old screen */ /* PLAY, or anywhere on the game: a clean round, tutorial and all */
  if(S.scene==='teaser'){if(inBox(p,CARD))S.scene='expand';return;}
  if(S.scene==='play'){G.down(p.x,p.y);return;}
  if(S.scene==='end'){if(inBox(p,BTN.again))start('play');else exit(inBox(p,BTN.loc)?CONFIG.links.locator:CONFIG.links.order);} /* every end-screen tap is an exit, except Play again */
});
const release=()=>{if(S.scene==='play')G.up();};
cv.addEventListener('pointermove',e=>{if(S.scene==='play'){const p=toLocal(e);G.move(p.x,p.y);}});
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);cv.addEventListener('lostpointercapture',release);cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('keydown',e=>{
  if(S.scene==='play'&&G.stage==='order'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();G.sel=G.sel<0?0:(G.sel+(e.key==='ArrowLeft'?MEALS.length-1:1))%MEALS.length;return;} /* arrows pick a card, space/enter takes it */
  if(e.key!==' '&&e.key!=='Enter')return;e.preventDefault();if(e.repeat)return;
  if(S.scene==='splash'){if(splashReady()){start('play');if(QS.has('howto'))G.howto();}}else if(S.scene==='teaser')S.scene='expand';else if(S.scene==='play'){if(G.stage==='order'){if(G.sel<0)G.sel=0;else G.pick(MEALS[G.sel]);} /* the first press highlights a card, the next takes it: no meal is ever picked by default */else if(G.stage==='fail'){if(G.failT>.5)start('play');}else G.keyDown();}else if(S.scene==='end')start('play');});
cv.addEventListener('keyup',e=>{if((e.key===' '||e.key==='Enter')&&S.scene==='play')G.keyUp();});
cv.addEventListener('blur',()=>G.cancel()); document.addEventListener('visibilitychange',()=>{if(document.hidden)G.cancel();}); /* no key-up comes once focus is gone: drop the charge rather than leave it running */

/* checks readout */
const listEl=document.getElementById('checklist'), sumEl=document.getElementById('checksum');
function renderChecks(){
  const rows=[];
  const iss=[...V.issues.entries()];
  rows.push({ok:iss.length===0,text:iss.length?`Overlap rules: ${iss.length} broken (${iss.slice(0,3).map(([k])=>k).join('; ')})`:'Overlap rules: nothing covers what it shouldn’t'});
  rows.push({ok:shadowBad===0&&shadowCalls>0,text:shadowCalls?(shadowBad?'Light: a shadow falls the wrong way':'Light: every shadow falls down and to the right'):'Light: no shadows drawn yet'});
  for(const [k,a] of Object.entries(V.anat)) rows.push({ok:a.fail===0,text:a.fail?`${k}: ${a.why}`:k});
  listEl.innerHTML=rows.map(r=>`<li class="${r.ok?'ok':'bad'}"><span>${r.ok?'✓':'✕'}</span><span>${r.text}</span></li>`).join('');
  const bad=rows.filter(r=>!r.ok).length;
  sumEl.textContent=`${rows.length} checks across ${V.frames} frames, ${bad} failing.`;
}
if(DEBUG) setInterval(renderChecks,600);

/* loop */
if(QS.has('test')) window.__G=G; /* ?test: the game object for scripted checks (stop landings, the handoff); off by default */
let last=performance.now();
function frame(now){
  if(!S.fontsOK){last=now;requestAnimationFrame(frame);return;} /* nothing draws before Speedee is in */
  const dt=Math.min(.05,(now-last)/1000); last=now; S.t+=dt;
  V.items=[]; V.opening=[]; if(GLG) GLG.frameStart();
  if(S.scene==='expand'){S.expand+=dt/(S.juice?.35:.12);if(S.expand>=1)S.scene='play';}
  if(S.scene==='play')G.update(dt);
  if(S.scene==='end')S.endT+=dt;
  if(S.scene==='splash'){S.splashT+=dt;const lp=Math.min(1,(ART_DONE+FONTS.n)/(ART_FILES.length+2));S.loadP+=(lp-S.loadP)*Math.min(1,dt*8);if(S.readyT==null&&(lp>=1||S.splashT>=4))S.readyT=S.splashT;demoStep(dt);} /* every picture in, or give up after 4 s; the attract loop runs meanwhile */
  updFX(dt); if(S.toast){S.toast.t+=dt;if(S.toast.t>2.2)S.toast=null;}
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0); ctx.clearRect(0,0,W,H);
  ctx.save(); if(FX.shake)ctx.translate((Math.random()-.5)*FX.shake,(Math.random()-.5)*FX.shake);
  if(S.scene==='teaser'||S.scene==='expand')drawTeaser();
  else if(S.scene==='play'){G.draw();}
  else if(S.scene==='splash')drawSplash();
  else drawEnd();
  if(S.scene==='expand'){const k=ease(S.expand);rr(lerp(CARD.x,0,k),lerp(CARD.y,0,k),lerp(CARD.w,W,k),lerp(CARD.h,H,k),lerp(16,0,k),P.red);}
  if(S.scene!=='play') drawFX(false);
  drawFX(true); drawFlash(); ctx.restore(); drawToast(); if(GLG) GLG.frameEnd();
  if(DEBUG&&(S.scene==='play'||S.scene==='splash')) validate(); /* normal play does no validation work */
  if(S.layers) drawLayers();
  requestAnimationFrame(frame);
}

const tog=(id,key,label)=>{const b=document.getElementById(id);const sync=()=>{b.setAttribute('aria-pressed',String(S[key]));};b.addEventListener('click',()=>{S[key]=!S[key];if(key==='juice'&&!S.juice)resetFX();sync();});sync();};
tog('juice','juice'); tog('labels','labels'); tog('layers','layers');
document.getElementById('restart').addEventListener('click',()=>{start('play');cv.focus();});
document.getElementById('teaser').addEventListener('click',()=>start('teaser'));
document.getElementById('skip').addEventListener('click',()=>{start('play');G.grades=['PERFECT','GOOD','PERFECT'];G.order={main:'Big Mac',side:'Fries',drink:'Soft drink'};G.bonus=2;G.left=4.2;S.scene='end';S.endT=0;S.endPuff=false;});

/* ?blueprint=Lx / ?explained=Lx: each layer's placeholder at the size and place it takes in the picture, drawn by the game's own code */
const BPDEF={ /* each layer's footprint silhouette at the origin, drawn by the game's own code; w×h is its extent (world px) */
 'roof-units':{w:30,h:22,cell:k=>{const w=k?20:30,h=k?15:22; roofUnit(-w/2,-h/2,w,h);}},
 canopy:{w:76,h:100,cell:()=>canopy(-38,-50,76,100,1)},
 speaker:{w:20,h:28,cell:()=>speaker(0,0)},
 'menu-board':{w:80,h:104,cell:()=>menuBoard(-40,-52)},
 palm:{w:50,h:50,cell:()=>palm(0,0,24)},
 'car-top':{w:44,h:80,cell:()=>carTop(0,0,{noreg:true})},
 'car-side':{w:132,h:66,cell:()=>carSide(-1,3,1,{noreg:true})},
 bag:{w:20,h:22,cell:()=>{ctx.translate(-18,0);bag();}},
 crew:{w:40,h:40,cell:()=>{ctx.fillStyle=BP.top;ctx.beginPath();ctx.arc(0,-7,10,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(0,14,17,9,0,Math.PI,0);ctx.fill();}},
 hands:{w:84,h:34,cell:k=>arm('blueprint arm',-40,0,6,0,P.sleeveCrew,P.skinCrew,-1,[card,bag,null][k>>1])},   /* the whole reach plus the card or bag inside the cell */
 'queue-cars':{w:44,h:80,cell:k=>queueCar(0,0,k)},
 bollard:{w:10,h:10,cell:()=>bollard(0,0)},
 planter:{w:34,h:70,cell:k=>planter(k?-11:-17,k?-35:-17,k)}};
function blueprint(){
  const L=LAYERS.find(l=>l.id===BPL)||LAYERS[0], cw=(L.canvas||[1024,1024])[0], ch=(L.canvas||[1024,1024])[1], ex=QS.has('explained'), D=BPDEF[L.name];
  cv.width=cw; cv.height=ch; cv.style.cssText=`width:${cw}px;height:${ch}px;aspect-ratio:auto;display:block`; document.body.style.display='block';
  BP={top:'#8C8C8C',face:'#5C5C5C'};
  const draw=()=>{ ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=L.key||'#FFFFFF'; ctx.fillRect(0,0,cw,ch); /* the key colour, white for tiles */
    const cols=L.cells?L.cells.cols:1, rows=L.cells?L.cells.rows:1, cW=cw/cols, cH=ch/rows, m=.1, k=D?Math.min(cW*(1-2*m)/D.w,cH*(1-2*m)/D.h):0;
    if(D) for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ctx.save();ctx.translate(cW*(c+.5),cH*(r+.5));ctx.scale(k,k);D.cell(r*cols+c);ctx.restore();} /* one placeholder per cell, centred, 10% margins */
    if(ex&&S.fontsOK){ const fs=Math.round(cw/(L.cells?44:26)), ink=L.key?P.white:P.ink, ln=L.key?P.ink:null;
      dtx(`${L.id} · ${L.name.toUpperCase()}`,24,24+fs*.6,fs*1.2,ink,'left',ln?fs*.25:0,ln);
      dtx(L.type==='tile'?`${L.cam} · SEAMLESS TILE · NOTHING TO PLACE`:L.cam,24,24+fs*2,fs*.7,ink,'left',ln?fs*.18:0,ln);
      if(D) dtx(`PLACEHOLDER ${Math.round(D.w*k)} × ${Math.round(D.h*k)} PX · CANVAS ${cw} × ${ch}`,24,24+fs*3,fs*.7,ink,'left',ln?fs*.18:0,ln);
      if(L.cells){ctx.setLineDash([12,10]);ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=3;for(let c=1;c<cols;c++){ctx.beginPath();ctx.moveTo(cW*c,0);ctx.lineTo(cW*c,ch);ctx.stroke();}ctx.setLineDash([]);
        L.cells.names.forEach((n,i)=>dtx(`CELL ${i+1}: ${n.toUpperCase()}`,cW*(i+.5),ch-30-fs*.5,fs*.75,ink,'center',ln?fs*.2:0,ln));} }
    requestAnimationFrame(draw); };
  draw();
}
if(GEO){ /* ?geometry: the layer contract as JSON for the pack builder; the game does not start */
  const pre=document.createElement('pre'); pre.id='geometry';
  pre.textContent=JSON.stringify({variant:'drive-thru',frame:[640,960],logical:[+W.toFixed(2),H],camera:{view:'straight down (top-down orthographic), polished 3D render; exceptions: L8 front-on billboard, L11 side profile, L13 front-on bust icon; height reads from cast shadows (one light, upper left)',zoom:ZK,offsetX:+ZX.toFixed(2),laneCentreX:+CX.toFixed(2),carY:G.CAR_Y},
    layers:LAYERS.map(L=>({id:L.id,name:L.name,type:L.type,canvas:L.canvas,key:L.key,camera:L.cam||null,cells:L.cells||null,box:L.box?{world:L.box,logical:L.box.map(v=>+(v*ZK).toFixed(1))}:null,status:L.status||'code'}))},null,1);
  cv.style.display='none'; document.body.style.display='block'; document.body.appendChild(pre);
} else if(BPL) blueprint();
else {
start('splash'); /* boot into the branded splash; Play again and Restart skip it */
/* QA (2026-10-29): ?card=splash | order | fail | end opens that screen straight away, as our other playables' ?card= does */
{const qc=new URLSearchParams(location.search).get('card');
 if(qc&&qc!=='splash') start('play');
 if(qc==='order'){G.stage='order';G.sel=-1;G.say('Welcome to McDonald’s! What can I get you?',99);}
 else if(qc==='fail'){G.timeUp();}
 else if(qc==='end'){document.getElementById('skip').click();}}
if(DEBUG) renderChecks();
requestAnimationFrame(frame);
}
})();
</script>
