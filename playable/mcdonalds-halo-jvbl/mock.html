  thumb: { x: 0, y: 0.667, w: 1, h: 0.333 },   // where the thumb rests; nothing play-critical is drawn under it
  keepOut: [{ x: 0, y: 0, w: 1, h: 0.125 }],   // the band

const OVL = { key: '', c: null };
function overlay(ctx, W, H) {

  if (OVL.key !== key) {
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(W)); c.height = Math.max(1, Math.round(H)); const x = c.getContext('2d');
    const sun = x.createRadialGradient(0, H * 0.1, 0, 0, H * 0.1, W * 1.1); sun.addColorStop(0, 'rgba(255,226,170,.22)'); sun.addColorStop(1, 'rgba(255,226,170,0)'); x.fillStyle = sun; x.fillRect(0, 0, W, H);
    const hz = x.createLinearGradient(0, H * (G.floor + 0.05), 0, H); hz.addColorStop(0, 'rgba(170,184,200,0)'); hz.addColorStop(1, 'rgba(150,166,188,.6)'); x.fillStyle = hz; x.fillRect(0, H * (G.floor + 0.05), W, H * (1 - G.floor));
    const vg = x.createRadialGradient(W * 0.5, H * 0.52, H * 0.32, W * 0.5, H * 0.52, H * 0.78); vg.addColorStop(0, 'rgba(24,16,10,0)'); vg.addColorStop(1, 'rgba(24,16,10,.3)'); x.fillStyle = vg; x.fillRect(0, 0, W, H);

const VIEW = {
  id: 'side-hop', build: true, title: 'Side view · hop across the canyon', canvas: G.canvas, camera: CAMERA, geometry: () => ({ ...G, play: P }),
  light: { tier: 2, dir: [-0.6, -0.8], color: '255,226,170', strength: 0.32, horizon: G.floor + 0.08, haze: '170,184,200' },
  world: {
    kind: 'ground',
    camera: { mode: 'side', span: P.span, floor: G.floor, anchor: G.anchor },
    layers: [],          // no code-drawn hills: the painted sky's own mesas stand behind the pillars (owner 2026-10-29)
    floorFace: false,    // no floor face under the floor line: the painted plate runs on below it, the pillars rise out of it
    // the canyon walls tile (L2) is the zone's ground and its road: a side world has no separate road surface
    zones: [{ at: 0, sky: ['#7fa8d8', '#f2dcb8'], ground: '#93a0b2', groundAlt: '#8c99ab', road: '#93a0b2', roadAlt: '#8c99ab', skyPlate: 'L1', groundTile: 'L2', roadTile: 'L2', haze: '#aab8c8' }],
    band: 8, drawDist: 40,
  },
  layers: [
    { id: 'L1', name: 'sky-ring', type: 'plate', canvas: [1920, 1920], key: null, camera: CAMERA, box: { x: 0.5, y: 0, w: 1.5, h: 1, anchor: 'top' },
      notes: 'picture · the far backdrop: a clear late-afternoon sky, the Halo™ ring arcing across it, a distant battlefield horizon low; the top eighth plain for the red band; wider than the frame for a slow parallax; distant smoke is code',
      shape(ctx, x, y, w, h, S, cell, o) {
        const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#7fa8d8'); g.addColorStop(0.6, '#f2dcb8'); g.addColorStop(1, '#c8b49a'); ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
        ctx.save(); ctx.strokeStyle = 'rgba(220,226,236,.75)'; ctx.lineWidth = w * 0.018; ctx.beginPath(); ctx.ellipse(x + w * 0.55, y + h * 0.62, w * 0.62, h * 0.42, -0.25, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke(); ctx.restore();
        ctx.fillStyle = '#9a8a7a'; ctx.fillRect(x, y + h * 0.7, w, h * 0.3);
        if (o && o.explain) { GB.bpZone(ctx, 0, 0, w, h * G.hudTop, '#ffa500', 'TOP 1/8: plain for the red band', true); GB.bpLabel(ctx, 30, h * 0.66, 'Floor line (pillar tops) at 2/3', '#ffd23a', true); } } },
    { id: 'L2', name: 'canyon-walls', type: 'tile', canvas: null, key: null, camera: CAMERA,   // not drawn since the floor face went (floorFace: false): no file, no request
      notes: 'picture · seamless horizontal tile: far canyon walls falling into cool blue-grey haze, repeated at half the pan speed; one flat tint until it is in',
      shape(ctx, x, y, w, h) { ctx.fillStyle = '#93a0b2'; ctx.fillRect(x, y, w, h); } },
    { id: 'L3', name: 'pillar', type: 'sheet', canvas: [1536, 1024], key: '#FF00FF', camera: CAMERA, states: true, grounded: true,

        ctx.fillStyle = 'rgba(60,40,20,.35)'; ctx.fillRect(cx - tw / 2, y + h * 0.07, tw, h * 0.015);   // the lip's contact shade under the top
        ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(cx, y + h * 0.085, tw * 0.4, h * 0.915); } },
    { id: 'L4', name: 'marine', type: 'sheet', canvas: [1536, 1024], key: '#FF00FF', camera: CAMERA, grounded: true,
      cells: { cols: 3, rows: 1, names: ['stand', 'crouch', 'leap'] }, box: { w: 0.14, h: 0.28, anchor: 'bottom' },
      notes: 'picture ×3 · a Halo™ marine side-on facing right, visor down, olive armour, NO weapon: stand, deep crouch, leap (knees tucked); feet on the cell floor; magenta key; squash, fall turn and drop-in are code',
      shape(ctx, x, y, w, h, S, cell) { const cx = x + w / 2, k = cell === 1 ? 0.62 : 1, b = y + h * 0.95, hh = h * 0.85 * k, C = '#6b7350', K = '#2e3222';
        GB.rr(ctx, cx - w * 0.16, b - hh * 0.5, w * 0.32, hh * 0.38, w * 0.06, C, K);
        GB.ell(ctx, cx + w * 0.02, b - hh * 0.62, w * 0.13, w * 0.12, C, K); GB.rr(ctx, cx + w * 0.04, b - hh * 0.66, w * 0.1, w * 0.06, w * 0.02, '#c08a2a');
        if (cell === 2) { GB.rr(ctx, cx - w * 0.14, b - hh * 0.2, w * 0.3, hh * 0.1, w * 0.04, C, K); }
        else { GB.rr(ctx, cx - w * 0.12, b - hh * 0.14, w * 0.09, hh * 0.14, w * 0.03, C, K); GB.rr(ctx, cx + w * 0.03, b - hh * 0.14, w * 0.09, hh * 0.14, w * 0.03, C, K); } } },
    { id: 'L5', name: 'nugget-box', type: 'sprite', canvas: [512, 512], key: '#4A5A7A', camera: CAMERA, grounded: true, box: { w: 0.07, h: 0.07 * 640 / 960, anchor: 'bottom' },
      notes: 'picture · the supplied closed box of Black Pepper & Garlic McNuggets®, cut out, side-on; slate key',
      shape(ctx, x, y, w, h) { GB.rr(ctx, x + w * 0.2, y + h * 0.3, w * 0.6, h * 0.62, w * 0.06, RED, '#7a0004'); GB.rr(ctx, x + w * 0.2, y + h * 0.2, w * 0.6, h * 0.14, w * 0.04, '#b00006', '#7a0004'); GB.ell(ctx, x + w * 0.5, y + h * 0.6, w * 0.12, h * 0.1, GOLD); } },
    { id: 'L11', name: 'nugget', type: 'sprite', canvas: [512, 512], key: '#FF00FF', camera: CAMERA, box: { w: 0.06, h: 0.06 * 640 / 960, anchor: 'centre' },
      notes: 'picture · one peppered nugget, cut out; floats in mid-air on the leap arcs (owner 2026-10-29); magenta key',
      shape(ctx, x, y, w, h) { GB.ell(ctx, x + w * 0.5, y + h * 0.5, w * 0.42, h * 0.36, '#d9a441'); } },
    { id: 'L6', name: 'restaurant', type: 'sprite', canvas: [1024, 768], key: '#FF00FF', camera: CAMERA, grounded: true, box: { w: 0.4, h: 0.4 * 640 / 960 * 0.75, anchor: 'bottom' },
      notes: 'picture · a McDonald\'s restaurant with the Golden Arches, side-on, standing on the last pillar top, the doorway facing LEFT; magenta key; the arches\' glow is code',
      shape(ctx, x, y, w, h) { GB.rr(ctx, x + w * 0.1, y + h * 0.4, w * 0.8, h * 0.58, w * 0.03, '#d9d0c4', '#3a3530'); GB.rr(ctx, x + w * 0.06, y + h * 0.32, w * 0.88, h * 0.12, w * 0.02, RED);
        GB.rr(ctx, x + w * 0.14, y + h * 0.62, w * 0.12, h * 0.36, w * 0.01, '#3a3530');
        ctx.save(); ctx.strokeStyle = GOLD; ctx.lineWidth = w * 0.04; ctx.beginPath(); ctx.moveTo(x + w * 0.5, y + h * 0.3); ctx.quadraticCurveTo(x + w * 0.58, y, x + w * 0.66, y + h * 0.3); ctx.quadraticCurveTo(x + w * 0.74, y, x + w * 0.82, y + h * 0.3); ctx.stroke(); ctx.restore(); } },
    { id: 'L7', name: 'nuggets-dip', type: 'sprite', canvas: [1024, 768], key: '#4A5A7A', camera: 'three-quarter product shot', box: { x: 0.42, y: 0.28, w: 0.52, h: 0.52 * 640 / 960 * 0.75, anchor: 'centre' },
      notes: 'SUPPLIED · product photography: the Black Pepper & Garlic McNuggets® out of the box with the sweet & sour dip; rises in on the win, stays above the sheet',
      shape(ctx, x, y, w, h) { GB.ell(ctx, x + w * 0.5, y + h * 0.7, w * 0.42, h * 0.16, '#efe9df', '#888'); for (let i = 0; i < 6; i++) GB.ell(ctx, x + w * (0.25 + i * 0.07), y + h * (0.55 + (i % 2) * 0.08), w * 0.07, h * 0.08, '#c98a3a', '#7a4a1a'); GB.ell(ctx, x + w * 0.76, y + h * 0.58, w * 0.08, h * 0.08, '#e86a2a', '#7a2a0a'); } },
    { id: 'L8', name: 'master-chief-armour', type: 'sprite', canvas: [768, 1024], key: '#4A5A7A', camera: 'campaign render', box: { x: 0.8, y: 0.29, w: 0.24, h: 0.24 * 640 / 960 * 4 / 3, anchor: 'centre' },
      notes: 'SUPPLIED · the campaign\'s own render of Master Chief in the McDonald\'s armour set; never generated; on both end sheets',
      shape(ctx, x, y, w, h) { GB.rr(ctx, x + w * 0.3, y + h * 0.3, w * 0.4, h * 0.6, w * 0.08, '#4a6a3a', '#1a2a12'); GB.ell(ctx, x + w * 0.5, y + h * 0.22, w * 0.16, w * 0.15, '#4a6a3a', '#1a2a12'); GB.rr(ctx, x + w * 0.38, y + h * 0.18, w * 0.24, h * 0.05, w * 0.02, GOLD); GB.rr(ctx, x + w * 0.3, y + h * 0.45, w * 0.4, h * 0.06, 0, RED); } },
    { id: 'L9', name: 'lockup', type: 'brand', canvas: [1024, 256], key: null, box: { x: 0.04, y: 0.02, w: 0.36, h: 0.06, anchor: 'top-left' },
      notes: 'SUPPLIED · the McDonald\'s campaign lockup; never drawn; the engine shows it in the band and on the cards', shape() {} },
    { id: 'L10', name: 'code-effects', type: 'hud-in-code', canvas: null, key: null, notes: 'code · crouch squash, leap arc, pan, dust puff, fall and whistle, the box float, ghost mark, SHORT/LONG pops, LEVEL stamp, drop-in, haze, shadows, contact shade on the tops, vignette, arches glow, win glow' },
    { id: 'L11', name: 'hud-cards', type: 'hud-in-code', canvas: null, key: null, notes: 'code · red band, rock and order pills, clock bar, hint pill, start card, win and fail sheets (Download the app big, Play again small)' },
  ],
  hud: {
    html: `<div class="hb-band"></div><div class="hb-pills"><div class="hb-pill hb-rock"><span class="hb-rk">Rock 0/7</span></div><div class="hb-pill hb-order"><i class="hb-box"></i><span class="hb-ord">No order</span></div></div><div class="hb-clock"><i></i></div><div class="hb-hint">Hold</div>`,
    css: `.hb-band{position:absolute;left:0;top:0;width:100%;height:12.5cqw;max-height:12.5%;background:linear-gradient(#e8141c,#c40006);box-shadow:0 .4cqw 1.2cqw rgba(0,0,0,.35);pointer-events:none}
.hb-pills{position:absolute;right:11cqw;top:2.2cqw;display:flex;gap:1.6cqw;pointer-events:none}
.hb-pill{display:flex;align-items:center;gap:1.2cqw;height:7.4cqw;padding:0 2.6cqw;border-radius:3.7cqw;font:900 3.6cqw Inter,system-ui,sans-serif;color:#2a1600;background:linear-gradient(#ffe27a,#ffbc0d 55%,#e09a00);box-shadow:inset 0 .5cqw 0 rgba(255,255,255,.6),inset 0 -.5cqw 0 rgba(0,0,0,.18),0 .5cqw 1cqw rgba(0,0,0,.35);transition:transform .12s}
.hb-order.bump{transform:scale(1.14);box-shadow:inset 0 .5cqw 0 rgba(255,255,255,.6),0 0 3cqw rgba(255,220,80,.95)}
.hb-box{width:3.4cqw;height:3.4cqw;border-radius:.6cqw;background:linear-gradient(#ff3a3a,#b00006);box-shadow:inset 0 .6cqw 0 #7a0004}
.hb-clock{position:absolute;left:0;top:12.5cqw;width:100%;height:1.3cqw;background:rgba(0,0,0,.35);pointer-events:none}
.hb-clock i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ffbc0d,#ffe27a);transform-origin:left}
.hb-clock.pulse i{background:linear-gradient(90deg,#ff3a1a,#ffbc0d);animation:hbp .5s ease-in-out infinite alternate}
@keyframes hbp{from{opacity:1}to{opacity:.45}}
.hb-hint{position:absolute;left:50%;top:84%;transform:translateX(-50%);padding:2cqw 5cqw;border-radius:5cqw;font:800 4.4cqw Inter,system-ui,sans-serif;color:#fff;background:rgba(20,16,10,.62);border:.4cqw solid rgba(255,188,13,.85);pointer-events:none;transition:opacity .25s}`,
    update(S, root, hud) {
      if (!hud || !root) return; const q = s => root.querySelector(s), st = root._st || (root._st = {});
      const rk = hud.left, ord = hud.order || hud.right, bump = (hud.bump || 0) > 0.3, cl = Math.max(0, Math.min(1, hud.clock == null ? 1 : hud.clock)).toFixed(3), pl = !!hud.pulse, hn = !!hud.hintOn;
      if (st.rk !== rk) { st.rk = rk; q('.hb-rk').textContent = rk; }
      if (st.ord !== ord) { st.ord = ord; q('.hb-ord').textContent = ord; }
      if (st.bump !== bump) { st.bump = bump; q('.hb-order').classList.toggle('bump', bump); }
      if (st.cl !== cl) { st.cl = cl; q('.hb-clock i').style.transform = 'scaleX(' + cl + ')'; }
      if (st.pl !== pl) { st.pl = pl; q('.hb-clock').classList.toggle('pulse', pl); }
      if (st.hn !== hn) { st.hn = hn; q('.hb-hint').style.opacity = hn ? 1 : 0; }
    },
  },
  drawFrame(ctx, S, W, H) {
    if (!S) return;
    const M = S.marine, shakeY = S.shake > 0 ? Math.sin(S.elapsed * 38) * S.shake * 0.08 : 0;   // a smooth decaying wobble
    WORLD.begin({ x: 0, y: shakeY, z: S.cam.z });
    // the leaning ruins: a broken narrow pillar behind the play plane, turned about its foot so its top rests on the next (or
    // previous) rock's shaft below the cap; tinted toward the haze and drawn first, behind the rocks
    (P.leaners || []).forEach(l => {
      const A = S.rocks[l.gap], B = S.rocks[l.gap + 1]; if (!A || !B) return;
      const R = l.lean > 0 ? B : A, side = l.lean > 0 ? -1 : 1, k = 0.82, Hh = G.pillarDepth * k, c = Math.cos(l.lean), sn = Math.sin(l.lean);
      const topZ = R.z + side * (0.8 * R.half + 0.48 * 0.8 * k * c), footZ = topZ - Hh * sn;
      WORLD.layer(L('L3'), 'box', 0, -G.pillarDepth - 0.6, footZ, 0.96 * k, Hh, '#c9bfb3', { cell: 2, shadow: false, sink: 0, rot: l.lean, depth: 1 });
    });
    S.rocks.forEach(r => {
      const cell = r.kind === 'wide' || r.kind === 'arches' ? 0 : r.kind === 'medium' ? 1 : 2;
      // the arches rock plays wider than the wide pillar's painted top: its picture is drawn scaled so the cap is its own top
      const pk = r.kind === 'arches' ? r.half / P.halves.wide : 1;
      WORLD.layer(L('L3'), 'box', 0, -G.pillarDepth * pk, r.z, r.half * 2, G.pillarDepth * pk, '#8a8178', { cell, shadow: false, sink: 0 });   // no cast shadow: the pillars rise out of the painted valley, no floor to fall on
      if (r.box && !r.taken) WORLD.layer(L('L5'), 'box', 0, 0.14 + 0.07 * Math.sin(S.elapsed * 3.2 + r.i), r.z + r.half * 0.35, 0.82, 0.69, RED, { shadow: true });   // bigger and bobbing (owner 2026-10-29: hardly visible)
      if (r.last) WORLD.layer(L('L6'), 'box', 0, 0, r.z + r.half * 0.15, r.half * 1.8, 2.0, '#d9d0c4', { shadow: true });
    });
    // the mid-air nuggets: a slow bob and a turn, drawn at their arc point (y is the picture's foot, so the centre sits on the arc)
    S.nuggets.forEach((n, i) => { if (n.taken) return; const bob = 0.05 * Math.sin(S.elapsed * 3 + i * 0.9), sz = 0.42 * (0.94 + 0.06 * Math.sin(S.elapsed * 5 + i));
      WORLD.layer(L('L11'), 'disc', 0, n.y + bob, n.z, sz, sz, '#d9a441', { shadow: false, centre: true }); });   // centred on its pick-up point
    S.floats.forEach(f => WORLD.layer(L('L5'), 'box', 0, f.y, f.z, 0.82, 0.69, RED, { shadow: false, alpha: f.alpha, centre: true, rot: f.rot }));
    S.spill.forEach(k => WORLD.layer(L('L11'), 'disc', 0, k.y, k.z, 0.38, 0.38, '#d9a441', { shadow: false, centre: true, rot: k.rot }));
    const overTop = S.rocks.some(r => Math.abs(M.z - r.z) < r.half);
    if (M.alpha > 0.01) {
      const cell = M.pose === 'crouch' ? 1 : M.pose === 'leap' || M.pose === 'fall' ? 2 : 0;
      // the poses are stills at one scale (owner 2026-10-29: never shrink a photo to fake a crouch): the crouch still from the first
      // moment of the hold, a 0.12 s settle on every pose change (a light squash from the feet, eased out), and a tremble that builds
      // with the charge so the hold reads as power gathering, strongest at full charge
      if (S.lastCell !== cell) { S.lastCell = cell; S.popAt = S.elapsed; }
      const e = Math.max(0, 1 - (S.elapsed - (S.popAt || -9)) / 0.12), pop = e * e;
      const charge = cell === 1 ? M.crouch : 0, tremble = charge > 0.15 ? Math.sin(S.elapsed * 60) * 0.022 * P.marineH * (charge - 0.15) / 0.85 : 0;
      const shadow = S.phase !== 'fall' && S.phase !== 'drop' && overTop;
      WORLD.layer(L('L4'), 'capsule', 0, M.y, M.z + tremble, P.marineH * 0.5, P.marineH * (1 + (cell === 2 ? 0.05 : -0.06) * pop), '#6b7350', { cell, shadow, alpha: M.alpha, squash: 1 + (cell === 2 ? -0.04 : 0.05) * pop });   // take-off stretches, crouch and landing squash
    }
    WORLD.end();
    overlay(ctx, W, H);
    // contact shade on the pillar tops: under each box still standing, under the restaurant, and under the marine when he stands on a top
    S.rocks.forEach(r => {
      if (r.box && !r.taken) { const p = WORLD.project(0, 0, r.z + r.half * 0.35); if (p) LAYERS.contact(ctx, p.x, p.y, p.s * 0.7, 0.6); }
      if (r.last) { const p = WORLD.project(0, 0, r.z + r.half * 0.15); if (p) LAYERS.contact(ctx, p.x, p.y, p.s * r.half * 2, 0.5); }
    });
