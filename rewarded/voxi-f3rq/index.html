<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>iion · VOXI rewarded video</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../shared/favicon-32.png"><link rel="icon" type="image/png" sizes="64x64" href="../../shared/favicon-64.png"><link rel="apple-touch-icon" href="../../shared/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../shared/page.css?v=11">
<link rel="stylesheet" href="../../shared/phone.css?v=7">
<link rel="stylesheet" href="../../shared/phone-land.css?v=5">
</head>
<body>
<nav class="nav"><img src="../../shared/iion-logo.png?v=2" alt="iion"></nav>

<section class="hero">
  <div class="eyebrow">Rewarded video · VOXI</div>
  <h1>Unlimited social media.</h1>
  <p>A landscape rewarded video: the game, then the 15-second VOXI spot with the reward countdown.</p>
</section>

<section class="stage phone-stage">
  <div class="phone land" data-noqr>
    <div class="screen interstitial">
      <!-- landscape rewarded video: the unit fills the whole screen (its own 16:9 letterbox); viewer taps ripple via data-ripple -->
      <div class="ad-slot fill" data-full="mock.html?full=1" data-ripple="pointer"><iframe src="mock.html?embed=1&amp;round" title="rewarded video ad" allow="autoplay"></iframe></div>
      <div class="island"></div>
      <div class="homebar"></div>
    </div>
    <i class="hw hw-action"></i><i class="hw hw-vol1"></i><i class="hw hw-vol2"></i><i class="hw hw-power"></i>
    <div class="floor"></div>
  </div>
  <div class="controls"><button class="snd" id="snd" type="button"></button></div>
</section>

<script>
  const ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
  const OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
  const f=document.querySelector('.ad-slot iframe'), b=document.getElementById('snd'); let on=false;
  function paint(){ b.classList.toggle('on',on); b.innerHTML=(on?ON:OFF)+(on?'Sound on':'Turn sound on'); }
  b.addEventListener('click',()=>{ on=!on; try{ f.contentWindow.DEMO.setSound(on); }catch(e){} paint(); });
  addEventListener('message',e=>{ if(e.data&&typeof e.data.iionSound==='boolean'){ on=e.data.iionSound; paint(); } });   // a tap or the ad's own speaker
  paint();
</script>
<script src="../../shared/touch.js?v=3"></script>
<script src="../../shared/theme.js?v=6"></script>
<script src="../../shared/fullscreen.js?v=2"></script>
</body>
</html>
