<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Jump into family time · McDonald’s Ireland</title>
<!-- iion creative-mocks playable unit (playable/_template contract), wrapping the Families production build.
     Generated by scripts/export-creative-mock.mjs in the Families project: edit there, not here.
     · 2:3 unit: fills the review page's phone slot (?embed=1) and centres on black when opened on its own or full screen (?full=1)
     · plays itself until a viewer touches it; the first touch takes over and unlocks the sound
     · posts {iionTap:{x,y}} for the page's finger ripple and exposes window.DEMO = { start, slotMs, setAuto, setSound }
     · the end card's button opens window.clickTag when an ad server sets one, else ctaUrl from families-config.js -->
<script>{const q=new URLSearchParams(location.search); if(q.has('embed')||q.has('full'))document.documentElement.classList.add('embed'); if(q.has('full'))document.documentElement.classList.add('full');}</script>
<script src="./families-config.js"></script>
<script>window.FAMILIES_CONFIG.soundEnabled = false; /* the self-playing demo is silent; the viewer's first touch turns sound on */</script>
<script type="module" src="./assets/index.js"></script>
<link rel="stylesheet" href="./assets/index.css">
<style>
/* The build is responsive to the window; as a mock it is always the 2:3 in-app unit on a black letterbox. */
:root, body { background: #000; }
body { align-items: center; }
#playable { width: min(100vw, calc(100vh * 2 / 3)); width: min(100vw, calc(100dvh * 2 / 3)); height: auto; aspect-ratio: 2 / 3; }
html.embed:not(.full) #playable { width: 100vw; height: 100vh; aspect-ratio: auto; }
.demo-press { transform: scale(.97) !important; background-color: #b80d14 !important; }
</style>
</head>
<body>
<main id="playable" aria-label="McDonald’s Ireland Families playable">
  <div id="game-container"></div>
  <div id="ui"></div>
</main>

<script>
(() => {
const unit = document.getElementById('playable');
const el = id => document.getElementById(id);
/* The build exposes its Phaser game as window.__game; everything below reads the live scene from it. */
const scene = () => { try { return window.__game && window.__game.scene.getScene('FamiliesGame'); } catch (e) { return null; } };

/* contract: tell the host page where the finger touched (0..1 of the ad unit) → shared/touch.js ripple */
function emitTap(x, y) { try { parent.postMessage({ iionTap: { x, y } }, '*'); } catch (e) {} }
function tapEl(node) { const s = unit.getBoundingClientRect(), r = node.getBoundingClientRect(); emitTap((r.left + r.width / 2 - s.left) / s.width, (r.top + r.height / 2 - s.top) / s.height); }
function tapEvent(e) { const s = unit.getBoundingClientRect(); emitTap((e.clientX - s.left) / s.width, (e.clientY - s.top) / s.height); }
function press(node) { tapEl(node); node.classList.add('demo-press'); setTimeout(() => node.classList.remove('demo-press'), 180); }

/* ══ sound: off for the demo, unlocked by the viewer's first touch ══ */
let soundUnlocked = false;
function setSound(on) {
  window.FAMILIES_CONFIG.soundEnabled = !!on;
  const s = scene(); if (!s || !s.ui) return;
  s.ui.muted = !on; s.ui.soundButton(); s.applyMute();
  const ctx = s.sound && s.sound.context;
  if (on && ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
}

/* ══ slot timeline (autopilot demo) ══ */
const SLOT_MS = 30000;      // nominal length of one demo loop
const T_AUTO_PLAY = 2600;   // the bot taps "Let’s jump" once the start screen has settled
const RUN_MS = 17000;       // then plays this long before letting the bag fall
const T_AUTO_CTA = 2600;    // presses the end card's button (without opening it) this long after the card appears
const T_LOOP = 5400;        // and loops back to the start screen
const FIELD_W = 640;        // the game's own coordinate width
let auto = true, seen = '', seenAt = performance.now(), pressing = false, ctaDone = false, rippleAt = 0;

function release() { const s = scene(); if (s && s._drag) s._drag.down = false; }
function takeOver() { if (!auto) return; auto = false; release(); }

/* Aim the bag at the highest tray it can still land on; when it is time to end the run, aim at the widest gap. */
function steer(s, now, bail) {
  const body = s.player && s.player.body, drag = s._drag;
  if (!body || !drag) return;
  const trays = s.platforms.getChildren().filter(t => t.active && t.body && t.body.enable && !t._broken);
  const feet = body.bottom, x = s.player.x, vy = body.velocity.y;
  let aim = null;
  if (bail) {
    const below = trays.filter(t => t.body.top > feet - 10 && t.body.top < feet + 760);
    let best = -1;
    for (let cx = 30; cx <= FIELD_W - 30; cx += 20) {
      const gap = below.reduce((m, t) => Math.min(m, Math.abs(t.x - cx) - t.displayWidth / 2), 1e9) - Math.abs(cx - x) * .15;
      if (gap > best) { best = gap; aim = cx; }
    }
  } else {
    const rise = vy < 0 ? -vy / 2650 : 0;                           // seconds until the top of the arc
    const apex = vy < 0 ? feet - vy * vy / (2 * 2650) : feet;        // feet height at the top of the arc
    const reachable = t => {
      const drop = t.body.top - apex; if (drop < 16) return false;
      const fall = vy < 0 ? Math.sqrt(2 * drop / 3300) : (-vy + Math.sqrt(vy * vy + 2 * 3300 * drop)) / 3300;
      return Math.abs(t.x - x) <= 760 * (rise + fall) * .8 + t.displayWidth * .3;
    };
    const options = trays.filter(reachable);
    // highest first; a tray carrying a favourite counts as a little higher so the bot collects on the way
    options.sort((a, b) => (a.body.top - (a.collectible ? 70 : 0)) - (b.body.top - (b.collectible ? 70 : 0)));
    if (options[0]) aim = options[0].x;
    else { const near = trays.filter(t => t.body.top > feet - 10).sort((a, b) => Math.abs(a.x - x) - Math.abs(b.x - x))[0]; if (near) aim = near.x; }
  }
  if (aim == null) { drag.down = false; return; }
  drag.down = true; drag.x = aim;
  if (now - rippleAt > 520) { rippleAt = now; emitTap(Math.min(.96, Math.max(.04, aim / FIELD_W)), .8); }   // where the demo's finger is
}

function start() {
  auto = true; pressing = false; ctaDone = false;
  const s = scene();
  if (s && s.ui && (s.ui.screen === 'hud' || s.ui.screen === 'end-screen')) s.scene.restart();   // back to the start screen
  seen = ''; seenAt = performance.now();
}

function tick(now) {
  requestAnimationFrame(tick);
  const s = scene(); if (!s || !s.ui) return;
  const screen = s.ui.screen;                       // 'loading' · 'start-screen' · 'hud' · 'end-screen'
  if (screen !== seen) { seen = screen; seenAt = now; ctaDone = false; pressing = false; }
  if (!auto) return;
  const t = now - seenAt;
  if (screen === 'start-screen' && t > T_AUTO_PLAY && !pressing) {
    pressing = true; press(el('start-button'));
    setTimeout(() => { if (auto && s.ui.screen === 'start-screen' && s.ui.onStart) s.ui.onStart(); }, 160);
  } else if (screen === 'hud' && s.phase === 'playing') {
    if (t > RUN_MS + 7000) s._onFall();             // safety net: never let the demo run on forever
    else steer(s, now, t > RUN_MS);
  } else if (screen === 'end-screen') {
    if (!ctaDone && t > T_AUTO_CTA) { ctaDone = true; press(el('cta-button')); }
    if (t > T_LOOP) start();
  }
}

/* A real touch, click or key takes over from the demo and (once) turns the sound on. */
addEventListener('pointerdown', e => {
  if (!e.isTrusted) return;
  tapEvent(e); takeOver();
  if (!soundUnlocked) { soundUnlocked = true; if (!(e.target.closest && e.target.closest('#sound'))) setSound(true); }
}, true);
addEventListener('keydown', e => { if (e.isTrusted) takeOver(); }, true);
/* An ad server's clickTag wins over the configured destination. */
addEventListener('click', e => { if (window.clickTag && e.target.closest && e.target.closest('#cta-button')) window.FAMILIES_CONFIG.ctaUrl = window.clickTag; }, true);

window.DEMO = { start, slotMs: SLOT_MS, setAuto: v => { auto = !!v; if (!auto) release(); }, setSound: on => { soundUnlocked = true; setSound(on); } };
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
