<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>BlackBear – Wife and Dog · Rewarded video + end card</title>
<style>
/* Landscape rewarded video (from the ad-banner-screenshot-generator rewarded mock): the game plays, a 0.3 s fade to black, then the ad
   full screen (16:9, black bars) with the "Seconds remaining" pill and a progress bar, both read from the ad's own duration.
   With an end card set (CONFIG.endcard) the end card follows the ad for 5 s with a close button; then the loop starts again.
   A tap anywhere turns the ad's sound on (like the live units); the speaker button toggles it. */
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
.unit{position:fixed;inset:0;background:#000;container-type:size;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
.pre{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
@media (max-aspect-ratio:3/2){.pre{object-fit:contain}}
.banner{position:absolute;left:50%;top:50%;width:min(100cqw,100cqh * 16 / 9);aspect-ratio:16/9;transform:translate(-50%,-50%);container-type:size;overflow:hidden}
.banner video,.banner .ec{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5}
.phase-pre .banner{visibility:hidden}
.phase-ad .pre,.phase-end .pre{visibility:hidden}
.ec{visibility:hidden;cursor:pointer}
.phase-end .ec{visibility:visible}
.phase-end .ad{visibility:hidden}
/* generator geometry, in % of the 16:9 banner: pill 12% of its height, 3% from the top and right */
.pill{position:absolute;top:3cqh;right:3cqw;height:12cqh;align-items:center;gap:1.8cqh;padding:0 2.4cqh 0 1.8cqh;border-radius:6cqh;
  background:rgba(100,100,100,.85);color:#fff;font-weight:500;font-size:3.36cqh;white-space:nowrap;z-index:3}
.pill b{flex:none;width:8.4cqh;height:8.4cqh;border-radius:50%;background:rgba(255,255,255,.9);color:#333;display:grid;place-items:center;font-weight:700;font-size:4.2cqh}
.bar{position:absolute;left:0;right:0;bottom:0;height:1.5cqh;background:rgba(0,0,0,.3);z-index:3}
.bar i{display:block;height:100%;width:0;background:#4285f4}
.mute{position:absolute;top:3cqh;left:3cqw;width:9cqh;height:9cqh;border-radius:50%;border:0;padding:0;background:rgba(100,100,100,.85);color:#fff;place-items:center;cursor:pointer;z-index:3}
.mute svg{width:55%;height:55%}
/* generator end card close: white circle, 4.5% of the banner height in radius, 3% of its width from the corner */
.close{position:absolute;top:3cqw;right:3cqw;width:9cqh;height:9cqh;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.9);color:#333;place-items:center;cursor:pointer;z-index:3}
.close svg{width:50%;height:50%}
.pill,.bar,.mute,.close{display:none}
.phase-ad .pill{display:flex}
.phase-ad .bar{display:block}
.phase-ad .mute{display:grid}
.phase-end .close{display:grid}
/* phone full screen (?full=1, opened by shared/mobile.js): held upright the landscape ad is a strip, so ask to turn the phone
   (as the CTV full-screen view does; landscape is never forced). Sideways it fills the screen. */
.turn{display:none}
@media (orientation:portrait){
  html.full .turn{display:flex;align-items:center;justify-content:center;gap:8px;position:fixed;left:0;right:0;top:calc(50% + 28.125vw + 22px);
    z-index:6;color:rgba(255,255,255,.72);font:500 14px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;pointer-events:none}
  html.full .turn svg{width:18px;height:18px}
}
</style>
<script>{const q=new URLSearchParams(location.search); if(q.has('full'))document.documentElement.classList.add('full'); if(q.has('round')){const r=document.documentElement; r.classList.add('round');
  // in the page's full-screen view (shared/fullscreen.js) the ad fills the display: square corners there
  try{const ph=parent.document.documentElement, sync=()=>r.classList.toggle('round',!ph.classList.contains('fs')); new MutationObserver(sync).observe(ph,{attributes:true,attributeFilter:['class']}); sync();}catch(e){}}}</script>
<style>
/* ?round (set by the phone page): the unit rounds its own corners to the phone screen's radius. Safari draws video in an iframe on
   its own layer and ignores any clip from the parent page, so the clip has to live here, next to the video. The mask-image is the
   WebKit trick that makes overflow+radius clip composited video. */
html.round,html.round body{background:transparent}
html.round .unit{border-radius:6.1% / 13.2%;overflow:hidden;isolation:isolate;transform:translateZ(0);
  -webkit-mask-image:-webkit-radial-gradient(white,black);mask-image:radial-gradient(white,black)}
</style>
</head>
<body>
<div class="unit phase-pre" id="unit">
  <video class="pre" id="pre"></video>
  <div class="banner">
    <video class="ad" id="ad"></video>
    <img class="ec" id="ec" alt="">
    <div class="pill" id="pill"><b id="secs">&nbsp;</b>Seconds remaining</div>
    <div class="bar"><i id="prog"></i></div>
    <button class="mute" id="mute" type="button" aria-label="Sound"></button>
    <button class="close" id="close" type="button" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="fade" id="fade"></div>
</div>
<div class="turn" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="10" height="15" rx="2"/><path d="M7 19h2"/><path d="M12 2.5a8.5 8.5 0 0 1 8.5 8.5"/><path d="M18 8.7l2.5 2.6 2.4-2.6"/></svg>Turn your phone sideways</div>
<script>
const CONFIG = {
  preroll: 'assets/game-preroll.mp4',   // the game the viewer was playing (a clip from _work/video-library/preroll/)
  ad: 'assets/ad.mp4',
  endcard: 'assets/endcard.jpg',        // image shown after the ad; null = no end card
  endcardMs: 5000,                      // generator: image end cards show for 5 s
  fadeMs: 300,                          // generator: 0.3 s fade to black between the game and the ad
  clickUrl: '',                           // end card tap (window.clickTag wins if the tag sets one)
};
const $ = id => document.getElementById(id);
const unit = $('unit'), pre = $('pre'), ad = $('ad'), ec = $('ec'), fade = $('fade');
const ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
const OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M23 9l-6 6M17 9l6 6"/></svg>';
let phase = 'pre', sound = false, unlocked = false, endTimer = 0, fading = false;
[pre, ad].forEach(v => { v.muted = true; v.defaultMuted = true; v.setAttribute('muted', ''); v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto'; });
pre.src = CONFIG.preroll; ad.src = CONFIG.ad;
if (CONFIG.endcard) ec.src = CONFIG.endcard;

function setPhase(p) { phase = p; unit.className = 'unit phase-' + p; }
function go(v) { try { v.currentTime = 0; } catch (e) {} const r = v.play(); if (r && r.catch) r.catch(() => { v.muted = true; v.play().catch(() => {}); }); }
function start() {
  clearTimeout(endTimer); ad.pause(); fading = false; fade.style.transition = 'none'; fade.style.opacity = 0;
  setPhase('pre'); go(pre);
}
function toAd() {
  pre.pause(); setPhase('ad'); ad.muted = !sound; go(ad);
  fade.style.transition = 'opacity 120ms linear'; fade.style.opacity = 0; fading = false;
}
function toEnd() {
  ad.pause();
  if (!CONFIG.endcard) { start(); return; }
  setPhase('end'); endTimer = setTimeout(start, CONFIG.endcardMs);
}
pre.addEventListener('timeupdate', () => {
  if (phase !== 'pre' || fading || !isFinite(pre.duration)) return;
  if (pre.duration - pre.currentTime <= CONFIG.fadeMs / 1000) {
    fading = true; fade.style.transition = 'opacity ' + CONFIG.fadeMs + 'ms linear'; fade.style.opacity = 1;
  }
});
pre.addEventListener('ended', () => { if (phase === 'pre') toAd(); });
ad.addEventListener('ended', () => { if (phase === 'ad') toEnd(); });

// countdown + progress: straight from the ad's duration, as in the generator
(function tick() {
  if (phase === 'ad' && isFinite(ad.duration) && ad.duration > 0) {
    $('secs').textContent = Math.max(0, Math.ceil(ad.duration - ad.currentTime));
    $('prog').style.width = Math.min(100, ad.currentTime / ad.duration * 100) + '%';
  }
  requestAnimationFrame(tick);
})();

function paintMute() { $('mute').innerHTML = sound ? ON : OFF; $('mute').setAttribute('aria-pressed', sound ? 'true' : 'false'); }
function setSound(on) { sound = !!on; ad.muted = !sound; paintMute(); try { if (parent !== window) parent.postMessage({ iionSound: sound }, '*'); } catch (e) {} }
// the first tap anywhere unlocks the sound; the speaker button handles its own toggle
document.addEventListener('pointerdown', e => { if (!unlocked && !e.target.closest('.mute')) { unlocked = true; setSound(true); } }, true);
$('mute').addEventListener('click', e => { e.stopPropagation(); unlocked = true; setSound(!sound); });
$('close').addEventListener('click', e => { e.stopPropagation(); start(); });
ec.addEventListener('click', () => { const u = window.clickTag || CONFIG.clickUrl; if (u) window.open(u, '_blank'); });
paintMute();

const slotMs = () => ((isFinite(pre.duration) ? pre.duration : 0) + (isFinite(ad.duration) ? ad.duration : 0)) * 1000 + (CONFIG.endcard ? CONFIG.endcardMs : 0);
window.DEMO = { start, get slotMs() { return slotMs(); }, setAuto: () => {}, setSound };
start();
</script>
</body>
</html>
