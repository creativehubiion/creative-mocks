<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Mobile Hybrid Mock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap">
<style>
/* Hybrid playable (320×480, 2:3) — same structure as the hybrid-game units (e.g. Employment Hero):
   video 37% on top, always playing · game 63% below (HUD strip, play area, start card, end cards inside the game half). */
:root{
  /* EDIT ME ▸ brand tokens */
  --b1:#ff5a36; --b2:#ffb21e; --deep:#3a0f2b; --ink:#16131a; --paper:#fff; --letterbox:#000;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html,body{width:100%;height:100%;background:#0f0f10;color:var(--paper);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.page{min-height:100%;display:grid;place-items:center;padding:24px}

/* 2:3 ad frame — everything inside is cqw (1cqw = 1% of frame width) */
.screen{position:relative;width:min(320px,90vw);aspect-ratio:2/3;overflow:hidden;display:flex;flex-direction:column;background:var(--letterbox);container-type:inline-size;
  --s1:.8cqw;--s2:1.2cqw;--s3:1.6cqw;--t2:2.4cqw;--t3:3cqw;--r:2cqw;
  --glass:linear-gradient(180deg,rgba(58,15,43,.55),rgba(22,10,20,.55));--hair:1px solid rgba(255,255,255,.22);
  --lift:inset 0 1px 0 rgba(255,255,255,.18),0 .4cqw 1.2cqw rgba(0,0,0,.3)}

/* ── VIDEO (37%) ── */
.video-area{height:37%;flex:none;position:relative;overflow:hidden;background:var(--ink)}
.video-area video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.spot{position:absolute;inset:0;display:grid;place-items:center;text-align:center;overflow:hidden;background:linear-gradient(160deg,var(--b1),#c92a5b 55%,#5b2a86)}
.spot::before{content:"";position:absolute;inset:-30%;background:radial-gradient(35% 35% at 30% 30%,rgba(255,255,255,.35),transparent 60%),radial-gradient(30% 30% at 70% 70%,rgba(255,210,120,.35),transparent 60%);animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-3%,-2%)}to{transform:translate(3%,3%)}}
.spot .wm{position:relative}
.spot b{display:block;font:900 6.4cqw/1.05 var(--f-ui);letter-spacing:-.15cqw}
.spot small{display:block;margin-top:1.6cqw;font:700 2.4cqw var(--f-ui);letter-spacing:.3cqw;opacity:.85}
.mute-btn{position:absolute;top:2.2cqw;right:2.2cqw;z-index:3;width:7cqw;height:7cqw;border-radius:50%;border:0;background:rgba(0,0,0,.5);display:grid;place-items:center;cursor:pointer}
.mute-btn svg{width:3.6cqw;height:3.6cqw;fill:#fff}

/* ── GAME (63%) ── */
.game-area{height:63%;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(120% 90% at 50% 20%,#4a1838 0%,#24091c 70%)}
.hud{position:absolute;left:var(--s3);right:var(--s3);top:var(--s3);height:10cqw;display:flex;gap:var(--s1);z-index:2;pointer-events:none;font-weight:800;font-variant-numeric:tabular-nums}
.plate{background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:var(--hair);border-radius:var(--r);box-shadow:var(--lift)}
.brand{flex:none;height:100%;aspect-ratio:1;display:grid;place-items:center;border-radius:var(--r);background:linear-gradient(180deg,#ff8a5c,var(--b1));border:1px solid rgba(255,255,255,.45);font:900 5cqw/1 var(--f-ui);color:#fff;box-shadow:var(--lift)}
.meter{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:var(--s1);padding:var(--s1) var(--s2)}
.meter label{font-size:var(--t2);letter-spacing:.2cqw;text-transform:uppercase;color:rgba(255,255,255,.78)}
.bar{position:relative;height:2cqw;border-radius:2cqw;overflow:hidden;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit;background:linear-gradient(180deg,#ffd27a,var(--b2) 60%,var(--b1));box-shadow:0 0 1.2cqw rgba(255,178,30,.7);transition:width .2s}
.stats{display:flex;align-items:center;gap:var(--s2);padding:var(--s1) var(--s2)}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1}
.stat b{font-size:4.2cqw}
.stat span{font-size:1.9cqw;letter-spacing:.2cqw;color:rgba(255,255,255,.78);margin-top:.4cqw}
.stats i{width:1px;align-self:stretch;background:rgba(255,255,255,.2)}
.arena{position:absolute;left:0;right:0;top:14cqw;bottom:0}
.bubble{position:absolute;width:17cqw;aspect-ratio:1;margin:-8.5cqw 0 0 -8.5cqw;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,0) 22%),linear-gradient(150deg,var(--b2),var(--b1));
  box-shadow:0 0 3cqw rgba(255,120,60,.45),inset 0 -1.6cqw 3cqw rgba(0,0,0,.15);animation:in .35s cubic-bezier(.2,1.4,.4,1)}
.bubble.gone{animation:out .28s ease-in forwards;pointer-events:none}
.bubble.miss{animation:fade .3s ease-in forwards;pointer-events:none}
@keyframes in{from{transform:scale(0)}}
@keyframes out{to{transform:scale(1.4);opacity:0}}
@keyframes fade{to{transform:scale(.6);opacity:0}}
.plus{position:absolute;font:900 5cqw var(--f-ui);color:#ffd27a;transform:translate(-50%,-50%);animation:rise .7s ease-out forwards;pointer-events:none;text-shadow:0 .3cqw .8cqw rgba(0,0,0,.4)}
@keyframes rise{to{transform:translate(-50%,-170%);opacity:0}}
.hint{position:absolute;left:50%;bottom:6cqw;translate:-50% 0;z-index:2;background:linear-gradient(180deg,#fff,#f4ecef);color:var(--ink);font-weight:800;font-size:var(--t3);padding:var(--s1) var(--s3);border-radius:10cqw;white-space:nowrap;pointer-events:none;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{translate:-50% -.8cqw}}

/* Start card — the attract demo keeps playing behind a light dim; the first tap unlocks sound */
.start{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;padding:8cqw;text-align:center;cursor:pointer;
  background:radial-gradient(ellipse at center,rgba(36,9,28,.35),rgba(36,9,28,.75))}
.start h2{font-size:8cqw;font-weight:900;line-height:1.05;letter-spacing:-.15cqw;text-wrap:balance;text-shadow:0 .4cqw 1.6cqw rgba(0,0,0,.6)}
.start p{font-size:3.6cqw;font-weight:700;color:rgba(255,255,255,.9)}

/* End cards — inside the game half (video keeps playing above): brand · result · actions */
.card{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8cqw 7cqw 7cqw;text-align:center;
  background:rgba(36,9,28,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;scale:.9}}
.card-logo{display:flex;align-items:center;gap:2cqw;font:900 6cqw/1 var(--f-ui)}
.card-logo i{width:9cqw;height:9cqw;border-radius:2.2cqw;background:linear-gradient(180deg,#ff8a5c,var(--b1));display:grid;place-items:center;font-style:normal;font-size:5cqw}
.result{display:flex;flex-direction:column;align-items:center;gap:var(--s3)}
.card .big{font-size:9cqw;font-weight:900;line-height:1.05;letter-spacing:-.15cqw;font-variant-numeric:tabular-nums}
.card .big em{font-style:normal;color:var(--b2)}
.card p{font-size:3.6cqw;font-weight:600;line-height:1.4;color:rgba(255,255,255,.82);max-width:74cqw;text-wrap:balance}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw;width:100%}
.btn{font:inherit;font-weight:900;font-size:4cqw;white-space:nowrap;padding:3.6cqw 2cqw;border-radius:10cqw;border:0;cursor:pointer;transition:translate .08s}
.btn.primary{background:linear-gradient(180deg,#ffd27a,var(--b2));color:var(--deep);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 .5cqw 0 #c47a00,0 1.2cqw 2.4cqw rgba(0,0,0,.4)}
.btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));color:#fff;border:1px solid rgba(255,255,255,.5);box-shadow:0 .5cqw 0 rgba(0,0,0,.45)}
.btn:active,.btn.press{translate:0 .6cqw}
.start .btn{margin-top:2cqw;padding:3.6cqw 9cqw;font-size:4.4cqw;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{scale:1.04}}
@media (prefers-reduced-motion:reduce){.spot::before,.hint,.start .btn{animation:none}}
</style>
<script>{const q=new URLSearchParams(location.search); if(q.has('embed')||q.has('full'))document.documentElement.classList.add('embed'); if(q.has('full'))document.documentElement.classList.add('full');}</script>
<style>
html.embed,html.embed body{background:var(--letterbox);overflow:hidden}
html.embed .page{display:block;padding:0;min-height:0;height:100%}
html.embed .screen{position:fixed;inset:0;width:100vw;height:100vh;aspect-ratio:auto}
html.full .screen{inset:0;margin:auto;width:min(100vw,calc(100dvh * 2 / 3));height:auto;aspect-ratio:2/3}
</style>
</head>
<body>
<div class="page">
  <div class="screen" id="screen">

    <div class="video-area" id="video">
      <div class="spot"><div class="wm"><b>Your brand video</b><small>37% · 320 × 480 HYBRID</small></div></div>
      <button class="mute-btn" id="muteBtn" type="button" aria-label="Unmute video">
        <svg id="muteIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
        <svg id="unmuteIcon" viewBox="0 0 24 24" hidden><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM14 3.2v2.1c2.9.9 5 3.5 5 6.7s-2.1 5.9-5 6.7v2.1c4-.9 7-4.5 7-8.8s-3-7.9-7-8.8z"/></svg>
      </button>
    </div>

    <div class="game-area" id="game">
      <div class="hud">
        <div class="brand">B</div>
        <div class="meter plate"><label>Bubbles popped</label><div class="bar"><i id="scoreBar"></i></div></div>
        <div class="stats plate">
          <div class="stat"><b id="timeVal">12</b><span>SEC</span></div><i></i>
          <div class="stat"><b id="popVal">0</b><span>POPPED</span></div>
        </div>
      </div>
      <div class="arena" id="arena"></div>
      <div class="hint" id="hint" hidden>Tap the bubbles</div>

      <div class="start" id="startCard">
        <h2>Pop the bubbles!</h2>
        <p>Pop 8 before time runs out</p>
        <button class="btn primary" id="playBtn" type="button">Tap to play</button>
      </div>

      <div class="card" id="winCard" hidden>
        <div class="card-logo"><i>B</i>Brand</div>
        <div class="result"><div class="big"><em id="winVal">8</em> popped!</div><p>One short line about the offer goes here.</p></div>
        <div class="btns"><button class="btn primary" id="ctaBtn" type="button">Shop now</button><button class="btn ghost" id="againBtn" type="button">Play again</button></div>
      </div>
    </div>

  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const screenEl=$('screen'), arena=$('arena');

/* ══ EDIT ME ▸ copy & tuning ══ */
const CONFIG={
  videoSrc:'',            // e.g. 'assets/video.mp4' — the brand spot (cover-cropped into the 37% strip)
  videoVolume:0.35,       // the first tap on the game unlocks sound at this volume
  ctaLabel:'Shop now', ctaUrl:'https://example.com',
  goal:8, roundMs:12000, lifeMs:1700, autoTapMs:650,
};

/* contract: tell the host page where the finger touched (0..1 of the ad unit) → shared/touch.js ripple */
function emitTap(x,y){ try{ parent.postMessage({iionTap:{x,y}},'*'); }catch(e){} }
function tapEl(el){ const s=screenEl.getBoundingClientRect(), r=el.getBoundingClientRect(); emitTap((r.left+r.width/2-s.left)/s.width,(r.top+r.height/2-s.top)/s.height); }
function tapEvent(e){ const s=screenEl.getBoundingClientRect(); emitTap((e.clientX-s.left)/s.width,(e.clientY-s.top)/s.height); }

/* ══ video (always on top) ══ */
let vid=null;
if(CONFIG.videoSrc){ vid=document.createElement('video'); vid.src=CONFIG.videoSrc; vid.muted=true; vid.defaultMuted=true; vid.setAttribute('muted',''); vid.playsInline=true; vid.setAttribute('playsinline',''); vid.autoplay=true; vid.loop=true; vid.preload='auto'; $('video').prepend(vid); }
function paintMute(){ const m=!vid||vid.muted; $('muteIcon').hidden=!m; $('unmuteIcon').hidden=m; }
function setSound(on){ if(!vid) return; vid.muted=!on; vid.volume=CONFIG.videoVolume; if(on){ const p=vid.play(); if(p&&p.catch) p.catch(()=>{}); } paintMute(); }
$('muteBtn').addEventListener('click',e=>{ tapEvent(e); takeOver(); soundUnlocked=true; setSound(!vid||vid.muted); });

/* ══ slot timeline (autopilot demo) ══ */
const SLOT_MS=20000, T_AUTO_PLAY=1600, T_AUTO_CTA=2600;    // autopilot taps "Tap to play" at 1.6 s, the CTA 2.6 s after the end card
const SCRIPTED_MISS=2;                                       // the 3rd bubble floats away once, so viewers see a miss
const autoBox={checked:true};
let t0=0, raf=0, mode='start', popped=0, live=null, spawnAt=0, playAt=0, endAt=0, missedOnce=false, ctaDone=false, soundUnlocked=false;

function takeOver(){ autoBox.checked=false; }
function unlockSound(){ if(soundUnlocked) return; soundUnlocked=true; setSound(true); }      // tap to play unlocks the sound
function paintHud(now){ $('popVal').textContent=popped; $('scoreBar').style.width=Math.min(100,popped/CONFIG.goal*100)+'%';
  $('timeVal').textContent=mode==='play'?Math.max(0,Math.ceil((CONFIG.roundMs-(now-playAt))/1000)):Math.round(CONFIG.roundMs/1000); }
function spawn(now){
  const b=document.createElement('div'); b.className='bubble';
  const W=arena.clientWidth, H=arena.clientHeight, r=screenEl.clientWidth*0.085;
  b.style.left=(r+Math.random()*(W-2*r))+'px'; b.style.top=(r+Math.random()*(H-2*r-screenEl.clientWidth*0.08))+'px';
  b.addEventListener('pointerdown',e=>{ e.stopPropagation(); takeOver(); unlockSound(); pop(b,e); });
  arena.appendChild(b); live=b; spawnAt=now;
}
function pop(b,e){
  if(live!==b) return; live=null;
  if(e) tapEvent(e); else tapEl(b);
  b.classList.add('gone'); setTimeout(()=>b.remove(),300);
  const p=document.createElement('div'); p.className='plus'; p.textContent='+1'; p.style.left=b.style.left; p.style.top=b.style.top; arena.appendChild(p); setTimeout(()=>p.remove(),720);
  popped++; spawnAt=performance.now();
  if(popped>=CONFIG.goal) finish();
}
function miss(b){ live=null; b.classList.add('miss'); setTimeout(()=>b.remove(),320); spawnAt=performance.now()+300; }
function play(now){ mode='play'; playAt=now; popped=0; missedOnce=missedOnce||!autoBox.checked; $('startCard').hidden=true; $('winCard').hidden=true; $('hint').hidden=false; spawnAt=now-1e4; }
function finish(){ mode='end'; endAt=performance.now(); live=null; $('hint').hidden=true; $('startCard').hidden=true; arena.querySelectorAll('.bubble').forEach(n=>n.remove()); $('winVal').textContent=popped; $('winCard').hidden=false; }

$('playBtn').addEventListener('click',e=>{ e.stopPropagation(); tapEvent(e); takeOver(); unlockSound(); play(performance.now()); });
$('startCard').addEventListener('click',e=>{ tapEvent(e); takeOver(); unlockSound(); play(performance.now()); });
$('againBtn').addEventListener('click',e=>{ tapEvent(e); takeOver(); play(performance.now()); });
$('ctaBtn').addEventListener('click',e=>{ tapEvent(e); takeOver(); ctaDone=true; try{ window.open(window.clickTag||CONFIG.ctaUrl,'_blank'); }catch(_){} });
$('game').addEventListener('pointerdown',e=>{ if(mode==='play' && !e.target.closest('.bubble')){ tapEvent(e); takeOver(); unlockSound(); } });
$('ctaBtn').textContent=CONFIG.ctaLabel;

function start(){
  cancelAnimationFrame(raf);
  t0=performance.now(); mode='start'; popped=0; live=null; missedOnce=false; ctaDone=false; autoBox.checked=true;
  arena.querySelectorAll('.bubble,.plus').forEach(n=>n.remove());
  $('startCard').hidden=false; $('winCard').hidden=true; $('hint').hidden=true; $('ctaBtn').classList.remove('press'); $('playBtn').classList.remove('press');
  if(vid){ try{ vid.currentTime=0; const p=vid.play(); if(p&&p.catch) p.catch(()=>{}); }catch(e){} }
  paintMute(); raf=requestAnimationFrame(tick);
}
function tick(now){
  const t=now-t0;
  if(t>=SLOT_MS && autoBox.checked){ start(); return; }                           // the demo loops; a viewer who took over keeps playing
  if(mode==='start' && autoBox.checked && t>=T_AUTO_PLAY){ mode='starting'; tapEl($('playBtn')); $('playBtn').classList.add('press'); setTimeout(()=>{ if(mode==='starting') play(performance.now()); },160); }
  if(mode==='play'){
    if(now-playAt>=CONFIG.roundMs){ finish(); }
    else{
      if(!live && now-spawnAt>320) spawn(now);
      if(live){ const age=now-spawnAt, willMiss=autoBox.checked && !missedOnce && popped===SCRIPTED_MISS;
        if(autoBox.checked && !willMiss && age>CONFIG.autoTapMs) pop(live,null);
        else if(age>CONFIG.lifeMs){ if(willMiss) missedOnce=true; miss(live); } }
    }
  }
  if(mode==='end' && autoBox.checked && !ctaDone && now-endAt>T_AUTO_CTA){ ctaDone=true; tapEl($('ctaBtn')); $('ctaBtn').classList.add('press'); setTimeout(()=>$('ctaBtn').classList.remove('press'),180); }
  paintHud(now);
  raf=requestAnimationFrame(tick);
}

window.DEMO={ start, slotMs:SLOT_MS, setAuto:v=>{autoBox.checked=!!v;}, setSound:on=>setSound(on) };
start();
</script>
</body>
</html>
