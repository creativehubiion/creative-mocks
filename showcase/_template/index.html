<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>iion · Brand mocks</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../shared/favicon-32.png"><link rel="icon" type="image/png" sizes="64x64" href="../../shared/favicon-64.png"><link rel="apple-touch-icon" href="../../shared/favicon-180.png">
<style>
/* One link, several mocks, maximum viewability: each mock page fills the whole window, unchanged, and the switcher lives in its
   own slim header (a tabs (icon + label, blue underline on the active one) in the centre slot, where the mock's title sits). It takes no space from the device.
   The header keeps its layout: iion logo top-left, then the brand in the format-label slot (the selected tab names the format),
   night toggle right.
   Only the chosen mock is loaded, so nothing plays in the background. To reuse: copy this folder, edit BRAND and MOCKS. */
html,body{margin:0;height:100%;overflow:hidden;background:#f5f5f7}
.view{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#f5f5f7;opacity:0;z-index:1}
.view.front{z-index:2}
.view.ready{opacity:1}
html.night .view{background:#0b0b0c}
</style>
</head>
<body>
<iframe class="view" title="Mock" allow="autoplay; fullscreen"></iframe>
<iframe class="view" title="Mock" allow="autoplay; fullscreen"></iframe>
<script>
const BRAND = 'Brand';
const ICON = {
  tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/></svg>',
  land: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6.5" width="20" height="11" rx="2.6"/><path d="M10.5 9.8v4.4l3.8-2.2z"/></svg>',
  landEnd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6.5" width="20" height="11" rx="2.6"/><rect x="6.5" y="9.5" width="11" height="5" rx="1"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 9.5v5l4-2.5z"/></svg>',
  tvGame: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/><path d="M9.5 10.25h5M12 7.75v5"/></svg>',
  laptop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="5" width="15" height="10.5" rx="1.4"/><path d="M2 18.5h20"/><path d="M10.6 8.6v3.8l3.2-1.9z"/></svg>',
  phoneWeb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M9 6.5h6"/><path d="M10.6 10.6v3.8l3.2-1.9z"/></svg>',
  phoneImg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M9 16.5l2.2-2.8 1.6 1.9 1.2-1.4 1 2.3"/><circle cx="10.4" cy="8.6" r="1.1"/></svg>',
  phonePlay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.6 6.8v3.4l2.9-1.7z"/><path d="M9.5 14.5h5M12 13v3"/></svg>',
};
// tab label (short = phone tab bar) · icon · the mock page (relative to this page) · #hash for deep links
const MOCKS = [
  { label: 'CTV', icon: 'tv', url: '../../ctv/_template-video/', id: 'ctv' },
  { label: 'Rewarded video', short: 'Rewarded', icon: 'land', url: '../../rewarded/_template/', id: 'rewarded' },
  { label: 'Rewarded video + end card', short: 'Rewarded + end card', icon: 'landEnd', url: '../../rewarded-endcard/_template/', id: 'endcard' },
];

// injected into each mock page: the segmented control replaces the title in the header's centre slot
const CSS = `
.nav{overflow:visible}
.mk-tabs{justify-self:center;align-self:stretch;display:flex;align-items:stretch;gap:6px;min-width:0}
.mk-tabs button{position:relative;appearance:none;border:0;background:none;margin:0;display:flex;align-items:center;gap:8px;padding:0 14px;cursor:pointer;
  font:500 14px/1 Inter,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.01em;color:var(--ink-2,#6e6e73);white-space:nowrap;transition:color .2s,background .2s}
.mk-tabs button svg{width:20px;height:20px;flex:none}
.mk-tabs button::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:transparent;transition:background .2s}
.mk-tabs button:hover{color:var(--ink,#1d1d1f)}
.mk-tabs button:hover::after{background:var(--line,#d2d2d7)}
.mk-tabs button[aria-selected="true"]{color:var(--ink,#1d1d1f);font-weight:600}
.mk-tabs button[aria-selected="true"] svg{color:#0071e3}
.mk-tabs button[aria-selected="true"]::after{background:#0071e3}
html.night .mk-tabs button[aria-selected="true"] svg{color:#2997ff}
html.night .mk-tabs button[aria-selected="true"]::after{background:#2997ff}
.mk-tabs button:focus-visible{outline:2px solid #0071e3;outline-offset:-4px;border-radius:8px}
.nav > .nav-title{display:none!important}
@media (max-width:900px){.mk-tabs{gap:0}.mk-tabs button{padding:0 10px;font-size:13px;gap:6px}.mk-tabs button svg{width:18px;height:18px}}
/* compact (every screen): one dropdown pill names the current mock + "1 / 3"; tapping it opens the
   phone's own picker with every mock (nothing hidden off-screen) */
.mk-pick{display:none;position:relative;align-items:center;gap:8px;justify-self:center;align-self:center}
.mk-pick .mk-sel{position:relative;display:flex;align-items:center;gap:8px;height:34px;padding:0 34px 0 12px;border:0;border-radius:999px;cursor:pointer;
  background:rgba(0,0,0,.06);color:var(--ink,#1d1d1f);font:600 13.5px/1 Inter,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.01em;white-space:nowrap}
.mk-pick .mk-sel:focus-visible{outline:2px solid #0071e3;outline-offset:2px}
html.night .mk-pick .mk-sel{background:rgba(255,255,255,.1)}
.mk-pick .mk-sel svg{width:18px;height:18px;flex:none;color:#0071e3}
html.night .mk-pick .mk-sel svg{color:#2997ff}
.mk-pick .mk-sel::after{content:"";position:absolute;right:13px;top:50%;width:7px;height:7px;margin-top:-5px;border:solid currentColor;border-width:0 1.8px 1.8px 0;transform:rotate(45deg);opacity:.7;transition:transform .2s,margin .2s}
.mk-pick.open .mk-sel::after{transform:rotate(-135deg);margin-top:-1px}
.mk-pick .mk-count{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);font:500 12px/1 Inter,-apple-system,sans-serif;color:var(--ink-2,#6e6e73);white-space:nowrap}   /* hangs off the pill so the pill itself is centred, like the active tab */
/* our own menu card (the native list looked plain and got cut off inside the frame) */
.mk-menu{position:absolute;top:calc(100% + 8px);left:50%;z-index:30;min-width:250px;max-width:calc(100vw - 24px);padding:6px;border-radius:14px;
  background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 12px 36px -8px rgba(0,0,0,.25);
  opacity:0;visibility:hidden;transform:translate(-50%,-4px);transition:opacity .18s,transform .18s,visibility 0s .18s}
.mk-pick.open .mk-menu{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .18s,transform .18s}
html.night .mk-menu{background:#1c1c1e;box-shadow:0 0 0 .5px rgba(255,255,255,.1),0 12px 36px -8px rgba(0,0,0,.7)}
.mk-menu button{width:100%;display:flex;align-items:center;gap:12px;appearance:none;border:0;background:none;text-align:left;cursor:pointer;
  padding:11px 12px;border-radius:9px;font:500 14px/1.2 Inter,-apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.01em;color:var(--ink,#1d1d1f)}
.mk-menu button svg{width:20px;height:20px;flex:none;color:var(--ink-2,#6e6e73)}
.mk-menu button:hover{background:rgba(0,0,0,.05)}
html.night .mk-menu button:hover{background:rgba(255,255,255,.07)}
.mk-menu button[aria-current="true"]{color:#0071e3;font-weight:600}
.mk-menu button[aria-current="true"] svg{color:#0071e3}
.mk-menu button[aria-current="true"]::after{content:"";margin-left:auto;width:5px;height:10px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-2px,-2px)}
html.night .mk-menu button[aria-current="true"],html.night .mk-menu button[aria-current="true"] svg{color:#2997ff}
.nav.mk-compact .mk-tabs{display:none}
.nav.mk-compact .mk-pick{display:flex}
/* phones: the second row sits clear of the logo/toggle row; the pill's top lines up with the tab icons, and both headers end at
   the same height (107px at 390 wide) */
@media (max-width:700px){.mk-pick{grid-area:title;margin-top:12px}.nav.mk-compact{padding-bottom:15px}}
.mk-tabs .mk-short{display:none}
/* switching is deliberate: the device leaves (dips + fades), a beat of empty stage, the new one rises into place; header stays */
.stage.mk-out{opacity:0;transform:translateY(12px) scale(.965);transition:opacity .2s ease-in,transform .22s ease-in}
.stage.mk-pre{opacity:0;transform:translateY(28px) scale(.97)}
.stage.mk-enter{transition:opacity .45s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.stage.mk-out,.stage.mk-pre{transform:none}.stage.mk-enter{transition:opacity .2s}}
/* phones: the header's second row is a small tab bar — equal tabs, icon over a short label, blue underline on the active one */
@media (max-width:700px){
  .nav:not(.mk-compact){padding-bottom:0}
  .nav:not(.mk-compact) .mk-tabs{grid-area:title;justify-self:stretch;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;margin:8px -14px 0}
  .mk-tabs button{flex-direction:column;justify-content:flex-start;gap:4px;padding:4px 4px 9px;font-size:11.5px;line-height:1.2;white-space:normal;text-align:center}
  .mk-tabs button svg{width:22px;height:22px}
  .mk-tabs button::after{left:18%;right:18%;bottom:0}
  .mk-tabs .mk-full{display:none}
  .mk-tabs .mk-short{display:inline}
}
`;

const frames = [...document.querySelectorAll('.view')];
const VER = new URLSearchParams(location.search).get('v');   // cache-buster: share the link with ?v=<anything new> after an update
const IS_PHONE = (navigator.userAgentData && navigator.userAgentData.mobile) ||
  /iPhone|iPod|Android.+Mobile|Windows Phone|Mobile Safari/i.test(navigator.userAgent) && !/iPad|Tablet/i.test(navigator.userAgent);
let cur = -1, token = 0, front = 1;   // frames[front] is the one on screen
// Switching: the tab answers at once, the current device leaves, the next mock loads in the hidden frame, and once its video has a
// first frame the frames swap (identical header, so invisible) and the new device rises into place. The old mock is unloaded.
function show(i) {
  if (i === cur) return; cur = i; const my = ++token;
  const old = frames[front], nxt = frames[1 - front];
  let oldStage = null;
  try { markActive(old.contentDocument, i); oldStage = old.contentDocument.querySelector('.stage'); } catch (e) {}   // tap answers at once
  if (oldStage) oldStage.classList.add('mk-out');                  // the current device leaves
  const left = new Promise(r => setTimeout(r, oldStage ? 300 : 0));   // its exit + a short empty beat
  document.title = 'iion · ' + BRAND + ' · ' + MOCKS[i].label;
  try { history.replaceState(null, '', '#' + MOCKS[i].id); } catch (e) {}
  nxt.classList.remove('ready', 'front');
  nxt.onload = async () => {
    if (my !== token) return;
    decorate(nxt, i);
    let st = null; try { st = nxt.contentDocument.querySelector('.stage'); if (st) st.classList.add('mk-pre'); } catch (e) {}
    await Promise.all([ready(nxt), left]);
    if (my !== token) return;
    nxt.title = BRAND + ' · ' + MOCKS[i].label;
    nxt.classList.add('front', 'ready'); old.classList.remove('front', 'ready'); front = 1 - front;   // same header: swap is invisible
    old.removeAttribute('src');                                                                     // only one mock keeps playing
    if (st) requestAnimationFrame(() => { st.classList.add('mk-enter'); st.classList.remove('mk-pre');   // the new device rises in
      setTimeout(() => st.classList.remove('mk-enter'), 700); });
  };
  // on a phone, mobile mock pages normally jump to the full-screen ad; here ?desktop keeps the page so the tabs stay
  const q = []; if (IS_PHONE) q.push('desktop'); if (VER) q.push('v=' + encodeURIComponent(VER));   // ?v= on this link reaches every page
  nxt.src = MOCKS[i].url + (q.length ? '?' + q.join('&') : '');
}
// ready to show = the device's video has a frame (or 1.2 s passed), then two paints so the layout has settled
function ready(f) {
  return new Promise(res => {
    let done = false;
    const fin = () => { if (done) return; done = true; requestAnimationFrame(() => requestAnimationFrame(res)); };
    setTimeout(fin, 1200);
    (function poll() {
      if (done) return;
      try {
        const inner = f.contentDocument.querySelector('.tv iframe, .ad-slot iframe, .screen iframe');
        const vids = inner && inner.contentDocument ? inner.contentDocument.querySelectorAll('video') : [];
        if ([].some.call(vids, v => v.readyState >= 2)) return fin();
        if (inner && inner.contentDocument && inner.contentDocument.readyState === 'complete' && !vids.length) return fin();
      } catch (e) {}
      setTimeout(poll, 60);
    })();
  });
}
// selection state in a mock page's header (tabs + pill + menu)
function markActive(d, i) {
  if (!d) return;
  d.querySelectorAll('.mk-tabs button').forEach((b, k) => b.setAttribute('aria-selected', k === i ? 'true' : 'false'));
  const p = d.querySelector('.mk-pick'); if (!p) return;
  p.classList.remove('open');
  const sel = p.querySelector('.mk-sel');
  sel.innerHTML = (ICON[MOCKS[i].icon] || '') + '<span></span>'; sel.lastChild.textContent = MOCKS[i].label;
  p.querySelector('.mk-count').textContent = (i + 1) + ' / ' + MOCKS.length;
  p.querySelectorAll('.mk-menu button').forEach((b, k) => k === i ? b.setAttribute('aria-current', 'true') : b.removeAttribute('aria-current'));
}
function decorate(frame, cur) {
  try {
    const d = frame.contentDocument, nav = d.querySelector('.nav');
    if (nav && !d.querySelector('.mk-tabs')) {
      const st = d.createElement('style'); st.textContent = CSS; d.head.appendChild(st);
      const box = d.createElement('div'); box.className = 'mk-tabs';
      box.setAttribute('role', 'tablist'); box.setAttribute('aria-label', BRAND + ' mocks');
      const fmt = nav.querySelector('.nav-format'); if (fmt) fmt.textContent = BRAND;   // brand where the format label was
      const seg = box;
      MOCKS.forEach((m, k) => {
        const b = d.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.innerHTML = (ICON[m.icon] || '') + '<span class="mk-full"></span><span class="mk-short"></span>'; b.querySelector('.mk-full').textContent = m.label; b.querySelector('.mk-short').textContent = m.short || m.label;
        b.setAttribute('aria-selected', k === cur ? 'true' : 'false');
        b.addEventListener('click', () => show(k));
        seg.appendChild(b);
      });
      // the compact picker: a pill naming the current mock + "2 / 3"; it opens our own menu card with every mock
      const pick = d.createElement('div'); pick.className = 'mk-pick';
      pick.innerHTML = '<button type="button" class="mk-sel" aria-haspopup="menu" aria-expanded="false">' + (ICON[MOCKS[cur].icon] || '') + '<span></span></button><span class="mk-count"></span><div class="mk-menu" role="menu"></div>';
      pick.querySelector('.mk-sel > span').textContent = MOCKS[cur].label;
      pick.querySelector('.mk-count').textContent = (cur + 1) + ' / ' + MOCKS.length;
      const selBtn = pick.querySelector('.mk-sel'), menu = pick.querySelector('.mk-menu');
      MOCKS.forEach((m, k) => {
        const it = d.createElement('button'); it.type = 'button'; it.setAttribute('role', 'menuitem');
        it.innerHTML = (ICON[m.icon] || '') + '<span></span>'; it.lastChild.textContent = m.label;
        if (k === cur) it.setAttribute('aria-current', 'true');
        it.addEventListener('click', () => show(k)); menu.appendChild(it);
      });
      const setOpen = o => { pick.classList.toggle('open', o); selBtn.setAttribute('aria-expanded', o ? 'true' : 'false'); };
      selBtn.addEventListener('click', e => { e.stopPropagation(); setOpen(!pick.classList.contains('open')); });
      d.addEventListener('click', e => { if (!pick.contains(e.target)) setOpen(false); });
      d.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
      // centre slot of the header grid (logo · title · night toggle): put the tabs where the title was
      const title = nav.querySelector('.nav-title');
      if (title) title.after(box, pick); else nav.insertBefore(box, nav.querySelector('.night-toggle'));
      if (!title) box.after(pick);
      const toggle = nav.querySelector('.night-toggle'); if (toggle) nav.appendChild(toggle);
      // always the picker (pill + menu card), on every screen (user, 2026-10-29: no row of tabs, no phone tab bar)
      nav.classList.add('mk-compact');
    }
  } catch (e) {}
}
// keep the page behind the frame in step with the mock's night mode (shared/theme.js key)
try { if (localStorage.getItem('iionNight') === '1') { document.body.style.background = '#0b0b0c'; document.documentElement.classList.add('night'); } } catch (e) {}

// #ctv / #rewarded / #endcard open that mock directly, also when the link changes on an open page
const fromHash = () => { const i = MOCKS.findIndex(m => '#' + m.id === location.hash); return i >= 0 ? i : 0; };
addEventListener('hashchange', () => show(fromHash()));
show(fromHash());
</script>
</body>
</html>
