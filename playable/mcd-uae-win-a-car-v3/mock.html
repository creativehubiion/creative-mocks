const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const S={scene:'teaser',t:0,juice:!reduce,labels:false,layers:false,expand:0,endT:0,toast:null};

function fit(){const r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));}
new ResizeObserver(fit).observe(cv); fit();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, ease=t=>1-Math.pow(1-clamp(t,0,1),3);
function path(x,y,w,h,r){ctx.beginPath(); if(ctx.roundRect) ctx.roundRect(x,y,Math.max(0,w),Math.max(0,h),r); else ctx.rect(x,y,w,h);}
function rr(x,y,w,h,r,fill,stroke,lw){path(x,y,w,h,r); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}}
function font(s,w){ctx.font=`${w||700} ${s}px Speedee, Nunito, system-ui, sans-serif`;} /* brand typeface Speedee is licensed: it wins if the agency loads it, Nunito stands in */
if(!document.querySelector('link[data-brand-font]')&&document.head){const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap';l.setAttribute('data-brand-font','');document.head.appendChild(l);}
function tx(s,x,y,size,col,align,weight){font(size||14,weight);ctx.fillStyle=col||P.ink;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);}
function wrap(s,x,y,maxW,size,col,weight,lh,align){font(size,weight);const words=s.split(' ');let line='';const out=[];for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}out.push(line);out.forEach((l,i)=>tx(l,x,y+i*lh,size,col,align,weight));return out.length;}
function dashBox(x,y,w,h,label,col){ctx.setLineDash([4,3]);rr(x,y,w,h,6,null,col||P.white,1.5);ctx.setLineDash([]);tx(label,x+w/2,y+h/2,9,col||P.white,'center',800);}
let shadowCalls=0, shadowBad=0;
function shade(drawPath,ox,oy){ /* all shadows go through here: one light direction */
  ox=ox==null?LIGHT.x:ox; oy=oy==null?LIGHT.y:oy; shadowCalls++; if(ox<=0||Math.abs(ox*LIGHT.y-oy*LIGHT.x)>.01) shadowBad++; /* shorter objects cast shorter shadows, same direction */
  ctx.save(); ctx.translate(ox,oy); ctx.fillStyle=P.shadow; drawPath(); ctx.fill(); ctx.restore();
}

/* ---------- textures (matte surfaces only) ---------- */
function makePattern(size,draw){const c=document.createElement('canvas');c.width=c.height=size;const g=c.getContext('2d');if(!g)return null;draw(g,size);return ctx.createPattern(c,'repeat');}
let rnd=7; const R=()=>(rnd=(rnd*16807)%2147483647)/2147483647;
const PAT={
  asphalt:makePattern(96,(g,s)=>{g.fillStyle=P.asphalt;g.fillRect(0,0,s,s);for(let i=0;i<420;i++){const v=R();g.fillStyle=v<.5?'rgba(255,255,255,.06)':'rgba(0,0,0,.12)';g.fillRect(R()*s,R()*s,1+R()*1.5,1+R()*1.5);}}),
  sand:makePattern(96,(g,s)=>{g.fillStyle=P.sand;g.fillRect(0,0,s,s);for(let i=0;i<160;i++){g.fillStyle=R()<.6?'rgba(170,140,95,.16)':'rgba(255,255,255,.35)';g.beginPath();g.arc(R()*s,R()*s,.6+R()*1.2,0,7);g.fill();}}),

  roof:makePattern(48,(g,s)=>{g.fillStyle=P.roof;g.fillRect(0,0,s,s);g.strokeStyle='rgba(255,255,255,.05)';for(let x=0;x<s;x+=8){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,s);g.stroke();}}),
  wood:makePattern(40,(g,s)=>{g.fillStyle=P.wood;g.fillRect(0,0,s,s);g.strokeStyle='rgba(60,35,15,.25)';for(let y=0;y<s;y+=5){g.beginPath();g.moveTo(0,y+.5);g.lineTo(s,y+.5);g.stroke();}})
};
const fillOr=(p,c)=>p||c;

/* ---------- validation ---------- */
const LAYER={ground:0,road:1,decal:2,ghost:2,stopline:2,shadow:3,prop:4,sign:4,building:5,car:6,hand:7,item:7,canopy:8,foliage:9,fx:10,label:10,hud:11,bubble:11,hint:11,sheet:12,receipt:12,reveal:12,wipe:12,cta:13,chip:13,toast:14};
const WORLD=k=>LAYER[k]<=10, UI=new Set(['hud','bubble','hint']), MODAL=new Set(['sheet','receipt','reveal','wipe','chip','cta']); /* chips and buttons inside a modal belong to it */
const PROTECT={car:['hand','item','fx','ghost','hint'], /* the hint hand demonstrates the swipe over the car */stopline:['car','hand','item','fx','shadow','ghost'], /* the LAST outline is outline-only, so it may cross the zone and the car */sign:['fx','car','hand','item'], /* hands and held items pass above the island signs */hand:['item','fx','hand'],item:['hand','fx'],hud:['toast'],bubble:['toast'],cta:['toast','fx'],chip:['fx','toast']};
const V={items:[],issues:new Map(),frames:0,anat:{},opening:[]};
let OFFY=0;
function reg(kind,name,x,y,w,h,o){V.items.push(Object.assign({kind,name,x,y:y-OFFY,w,h},o||{}));}
function opening(name,x,y,w,h){V.opening.push({name,x,y:y-OFFY,w,h});}
function anat(name,ok,why){const a=V.anat[name]||(V.anat[name]={pass:0,fail:0,why:''});if(ok)a.pass++;else{a.fail++;a.why=why;}}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function allowed(top,bot){
  const prot=PROTECT[bot.kind]; if(!prot) return true;
  if(top.kind==='canopy'&&top.faded&&['car','hand','item','stopline'].includes(bot.kind)) return true;
  if(MODAL.has(top.kind)&&WORLD(bot.kind)) return true;
  if(UI.has(top.kind)&&WORLD(bot.kind)&&!['car','stopline','hand','item'].includes(bot.kind)) return true;
  return prot.includes(top.kind);
}
function validate(){
  V.frames++;
  const vis=V.items.filter(i=>i.kind!=='label'&&i.x<W&&i.x+i.w>0&&i.y<H&&i.y+i.h>0);
  for(let i=0;i<vis.length;i++)for(let j=0;j<vis.length;j++){
    if(i===j)continue; const a=vis[i],b=vis[j];
    if(LAYER[a.kind]<LAYER[b.kind]||(LAYER[a.kind]===LAYER[b.kind]&&i<j)) continue;
    if(!hit(a,b)) continue;
    if(a.owner&&a.owner===b.name) continue; if(b.owner&&b.owner===a.name) continue;
    if(!allowed(a,b)){const key=`${a.name} over ${b.name}`;V.issues.set(key,(V.issues.get(key)||0)+1);a.bad=b.bad=true;}
  }
}

/* ---------- juice ---------- */
const FX={shake:0,parts:[],pops:[],flash:0,smiles:[]};
const shake=a=>{if(S.juice)FX.shake=Math.max(FX.shake,a);};
const flash=()=>{if(S.juice)FX.flash=1;};
function burst(x,y,n,col,kind,ui){if(!S.juice)return;for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=(kind==='dust'?30:70)+Math.random()*(kind==='dust'?60:190);FX.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(kind==='dust'?10:80),g:kind==='dust'?0:520,life:.5+Math.random()*.45,t:0,col:col||P.yellow,r:kind==='dust'?3+Math.random()*4:2+Math.random()*3.5,star:kind==='star',ui:!!ui});}}
const pop=(text,x,y,col,ui)=>FX.pops.push({text,x,y,t:0,col:col||P.ink,ui:!!ui});

const MENU=[{key:'main',label:'Main',opts:['Big Mac','Big Tasty','McCrispy','McArabia']},{key:'side',label:'Side',opts:['Fries','Nuggets']},{key:'drink',label:'Drink',opts:['Soft drink','Water','Iced coffee']}];
const LANE_L=188, LANE_R=304, LANE_C=246, DRIVER=40; /* driver window sits 40px behind the front bumper */
/* flick physics: constant friction, so stopping distance = v^2 / (2*FRICTION) and the same swipe always rolls the same distance */
/* tuned by the 40-agent playtest (playtest/): distance grows with swipe speed^0.7, not speed^2,
   so a 10% sloppier swipe is a 7% miss instead of a 20% one */
const FRICTION=520, GAMMA=.7, SREF=1300, DREF=380, DMAX=720, WIN=[54,44,36], GROW=1.25, ZMAX=64, PERFECT=8, STAR_TRIES=3;
/* no guide-in: every miss quietly widens the zone by 25%, so nobody gets stuck (agents: 96% of stops made within 3 tries, worst case 7) */
const distFor=s=>Math.min(DMAX,DREF*Math.pow(Math.max(0,s)/SREF,GAMMA));
const G={
  stops:[{y:-400,label:'Speaker'},{y:-800,label:'Pay'},{y:-1150,label:'Collect'}],
  CAR_Y:470,
  init(){this.hintT=0;this.idle=0;this.y=0;this.v=0;this.hold=false;this.stage='aim';this.ghostY=null;this.perfStreak=0;this.slow=0;this.started=false;this.tries=0;this.drag=null;this.power=0;this.lastPower=null;this.charging=false;this.i=0;this.grades=[];this.order={};this.row=0;this.anim=0;this.brake=0;this.cam=this.y-this.CAR_Y;this.trail=[];this.bubble=null;this.ahead=false;this.recT=0;this.scanT=-1;this.stamped=false;this.revealT=0;this.payPop=false;this.chips=[];this.win=0;this.dustT=0;this.cam=this.camTarget();},
  scr(wy){return wy-this.cam;},
  say(text,d){this.bubble={text,t:0,d:d||1.8};},
  hush(){if(this.bubble)this.bubble.t=Math.max(this.bubble.t,this.bubble.d-.15);}, /* crew stops talking once you're free to drive */
  aimish(){return ['aim','roll','miss'].includes(this.stage);},
  zone(k){return Math.min(ZMAX,WIN[k]*Math.pow(GROW,k===this.i?this.tries:0));}, /* current stop's zone grows with each miss, up to what the camera can frame */
  checkY(){return this.i===0?0:this.stops[this.i-1].y+38;}, /* last checkpoint: start, or the last stop you made */
  /* ---------- flick input: swipe up the lane; speed of the swipe = launch speed ---------- */
  down(x,y){
    if(this.stage==='aim'){this.drag={sy:y,pts:[{x,y,t:performance.now()}]};this.power=0;this.hush();return;}
    if(this.stage==='order'){for(const c of this.chips){if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h&&c.row===this.row){this.pick(c);return;}}return;}
    if(this.stage==='receipt'&&this.recT>.45&&this.scanT<0) this.scanT=0;
  },
  move(x,y){
    if(this.stage!=='aim'||!this.drag) return;
    const now=performance.now(); this.drag.pts.push({x,y,t:now}); this.drag.pts=this.drag.pts.filter(p=>now-p.t<=100);
    this.power=clamp(distFor(this.swipeSpeed())/DMAX,0,1); /* the bar reads as distance */
  },
  swipeSpeed(){const p=this.drag.pts; if(p.length<2) return 0; const a=p[0], b=p[p.length-1]; return Math.max(0,(a.y-b.y)/(Math.max(16,b.t-a.t)/1000));}, /* upward speed over the last 100ms */
  up(){
    if(this.stage!=='aim'||!this.drag) return;
    const pts=this.drag.pts, last=pts[pts.length-1], travel=this.drag.sy-last.y, pw=clamp(distFor(this.swipeSpeed())/DMAX,0,1);
    this.drag=null;
    if(travel<18||pw<.05){pop('SWIPE UP',LANE_C,this.scr(this.y)-70);this.power=0;return;}
    this.launch(pw);
  },
  launch(pw){
    this.v=Math.sqrt(2*FRICTION*pw*DMAX); this.lastPower=pw; this.power=pw; this.stage='roll'; this.started=true; this.charging=false;

function toLocal(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
const inBox=(p,b)=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h;
cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=toLocal(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(S.scene==='teaser'){if(inBox(p,CARD))S.scene='expand';return;}
  if(S.scene==='play'){G.down(p.x,p.y);return;}
  if(S.scene==='end'){if(inBox(p,BTN.loc))S.toast={text:'Opens the store locator: nearest drive-thru from Azira’s location data',t:0};else if(inBox(p,BTN.order))S.toast={text:'Deep-links to the McDonald’s App to order and earn an entry',t:0};else if(inBox(p,BTN.again))start('play');}
});
const release=()=>{if(S.scene==='play')G.up();};
cv.addEventListener('pointermove',e=>{if(S.scene==='play'){const p=toLocal(e);G.move(p.x,p.y);}});
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);cv.addEventListener('lostpointercapture',release);cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('keydown',e=>{if(e.key!==' '&&e.key!=='Enter')return;e.preventDefault();if(e.repeat)return;
  if(S.scene==='teaser')S.scene='expand';else if(S.scene==='play'){if(G.stage==='order'){const c=G.chips.find(c=>c.row===G.row);if(c)G.pick(c);}else if(G.stage==='aim'){G.charging=true;G.power=0;}else G.down(180,320);}else if(S.scene==='end')start('play');});
cv.addEventListener('keyup',e=>{if((e.key===' '||e.key==='Enter')&&S.scene==='play'&&G.charging){G.launch(Math.max(.05,G.power));}});

/* checks readout */
const listEl=document.getElementById('checklist'), sumEl=document.getElementById('checksum');
function renderChecks(){
  const rows=[];
  const iss=[...V.issues.entries()];
  rows.push({ok:iss.length===0,text:iss.length?`Overlap rules: ${iss.length} broken (${iss.slice(0,3).map(([k])=>k).join('; ')})`:'Overlap rules: nothing covers what it shouldn’t'});
  rows.push({ok:shadowBad===0&&shadowCalls>0,text:shadowCalls?(shadowBad?'Light: a shadow falls the wrong way':'Light: every shadow falls down and to the right'):'Light: no shadows drawn yet'});
  for(const [k,a] of Object.entries(V.anat)) rows.push({ok:a.fail===0,text:a.fail?`${k}: ${a.why}`:k});
  listEl.innerHTML=rows.map(r=>`<li class="${r.ok?'ok':'bad'}"><span>${r.ok?'✓':'✕'}</span><span>${r.text}</span></li>`).join('');
  const bad=rows.filter(r=>!r.ok).length;
  sumEl.textContent=`${rows.length} checks across ${V.frames} frames, ${bad} failing.`;
}
setInterval(renderChecks,600);

/* loop */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; S.t+=dt;
  V.items=[]; V.opening=[];
  if(S.scene==='expand'){S.expand+=dt/(S.juice?.35:.12);if(S.expand>=1)S.scene='play';}
  if(S.scene==='play')G.update(dt);
  if(S.scene==='end')S.endT+=dt;
  updFX(dt); if(S.toast){S.toast.t+=dt;if(S.toast.t>2.2)S.toast=null;}
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0); ctx.clearRect(0,0,W,H);
  ctx.save(); if(FX.shake)ctx.translate((Math.random()-.5)*FX.shake,(Math.random()-.5)*FX.shake);
  if(S.scene==='teaser'||S.scene==='expand')drawTeaser();
  else if(S.scene==='play'){G.draw();}
  else drawEnd();
  if(S.scene==='expand'){const k=ease(S.expand);rr(lerp(CARD.x,0,k),lerp(CARD.y,0,k),lerp(CARD.w,W,k),lerp(CARD.h,H,k),lerp(16,0,k),P.red);}
  if(S.scene!=='play') drawFX(false);
  drawFX(true); drawFlash(); ctx.restore(); drawToast();
  if(S.scene==='play') validate();
  if(S.layers) drawLayers();
  requestAnimationFrame(frame);
}

const tog=(id,key,label)=>{const b=document.getElementById(id);const sync=()=>{b.setAttribute('aria-pressed',String(S[key]));};b.addEventListener('click',()=>{S[key]=!S[key];if(key==='juice'&&!S.juice)resetFX();sync();});sync();};
tog('juice','juice'); tog('labels','labels'); tog('layers','layers');
document.getElementById('restart').addEventListener('click',()=>{start('play');cv.focus();});
document.getElementById('teaser').addEventListener('click',()=>start('teaser'));
document.getElementById('skip').addEventListener('click',()=>{start('play');G.grades=['PERFECT','GOOD','PERFECT'];G.order={main:'Big Tasty',side:'Fries',drink:'Soft drink'};S.scene='end';S.endT=0;S.endPuff=false;});

start('play');
renderChecks();
requestAnimationFrame(frame);
})();
</script>
<script>
/* any space around the 9:16 game takes the colour of the game's own edges, so only the game shows */
const cv0=document.getElementById('game');
function edge(){try{const c=cv0.getContext('2d'),a=c.getImageData(1,1,1,1).data,b=c.getImageData(1,cv0.height-2,1,1).data;const top=`rgb(${a[0]},${a[1]},${a[2]})`,bot=`rgb(${b[0]},${b[1]},${b[2]})`;document.body.style.background=`linear-gradient(${top} 50%,${bot} 50%)`;document.documentElement.style.background=top;}catch(e){}setTimeout(edge,200);}
edge();
</script>
