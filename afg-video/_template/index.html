<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>iion · Brand away from the game video</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../shared/favicon-32.png"><link rel="icon" type="image/png" sizes="64x64" href="../../shared/favicon-64.png"><link rel="apple-touch-icon" href="../../shared/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../shared/page.css?v=11">
<link rel="stylesheet" href="../../shared/laptop.css?v=5">
</head>
<body>
<nav class="nav"><img src="../../shared/iion-logo.png?v=2" alt="iion"></nav>

<section class="hero">
  <div class="eyebrow">Away from the game video · Brand</div>
  <h1>Headline.</h1>
  <p>One line about the mock (not shown on the page).</p>
</section>

<section class="stage">
  <div class="laptop">
    <div class="lid"><div class="bezel">
      <div class="screen">
        <iframe src="mock.html?embed=1" title="Away from the game video mock" allow="autoplay"></iframe><script>{const v=new URLSearchParams(location.search).get("v"),f=document.currentScript.previousElementSibling;if(v&&f&&f.tagName==="IFRAME")f.src=f.getAttribute("src")+"&v="+encodeURIComponent(v);}</script>
        <div class="glass"></div>
      </div>
      <i class="cam"></i>
    </div></div>
    <div class="base"></div>
    <div class="floor"></div>
    <div class="controls"><button class="snd" id="snd" type="button"></button></div>
  </div>
</section>


<script>
  const ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
  const OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
  const f=document.querySelector('iframe'), b=document.getElementById('snd'); let on=false;
  function paint(){ b.classList.toggle('on',on); b.innerHTML=(on?ON:OFF)+(on?'Sound on':'Turn sound on'); }
  b.addEventListener('click',()=>{ on=!on; try{ const w=f.contentWindow; if(w.DEMO&&w.DEMO.setSound) w.DEMO.setSound(on); }catch(e){} paint(); });
  paint();
</script>
<script src="../../shared/theme.js?v=6"></script>
<script src="../../shared/fullscreen.js?v=2"></script>
</body>
</html>
