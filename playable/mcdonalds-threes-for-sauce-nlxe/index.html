      const M = window.MOTION, cam = st.cam.value();

      WORLD.board({ id: 'ribbon', x: 0, y: 4.4, z: 19.5, w: 30, h: 0.9, text: C.copy.line, colour: WALL[0], ink: R.key, speed: -0.9, glow: true });
